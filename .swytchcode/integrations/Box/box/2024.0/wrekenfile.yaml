        template will have provided its own template key.

        Please [list the templates for an enterprise][list], or
        get all instances on a [file][file] or [folder][folder]
        to inspect a template's key.

        [list]: https://developer.box.com/reference/get-metadata-templates-enterprise
        [file]: https://developer.box.com/reference/get-files-id-metadata
        [folder]: https://developer.box.com/reference/get-folders-id-metadata
  MetadataError:
    - name: code
      type: STRING
      REQUIRED: false
      comment: A Box-specific error code.
    - name: message
      type: STRING
      REQUIRED: false
      comment: A short message describing the error.
    - name: request_id
      type: STRING
      REQUIRED: false
      comment: |-
        A unique identifier for this response, which can be used
        when contacting Box support.
  MetadataFilter:
    - name: scope
      type: STRING
      REQUIRED: false
      comment: |-
        Specifies the scope of the template to filter search results by.

        This will be `enterprise_{enterprise_id}` for templates defined
        for use in this enterprise, and `global` for general templates
        that are available to all enterprises using Box.
    - name: templateKey
      type: STRING
      REQUIRED: false
      comment: |-
        The key of the template used to filter search results.

        In many cases the template key is automatically derived
        of its display name, for example `Contract Template` would
        become `contractTemplate`. In some cases the creator of the
        template will have provided its own template key.

        Please [list the templates for an enterprise][list], or
        get all instances on a [file][file] or [folder][folder]
        to inspect a template's key.

        [list]: https://developer.box.com/reference/get-metadata-templates-enterprise
        [file]: https://developer.box.com/reference/get-files-id-metadata
        [folder]: https://developer.box.com/reference/get-folders-id-metadata
    - name: filters
      type: map[STRING]ANY
      REQUIRED: false
      comment: |-
        Specifies which fields on the template to filter the search
        results by. When more than one field is specified, the query
        performs a logical `AND` to ensure that the instance of the
        template matches each of the fields specified.
  MetadataQuery:
    - name: from
      type: STRING
      REQUIRED: true
      comment: |-
        Specifies the template used in the query. Must be in the form
        `scope.templateKey`. Not all templates can be used in this field,
        most notably the built-in, Box-provided classification templates
        can not be used in a query.
    - name: query
      type: STRING
      REQUIRED: false
      comment: |-
        The query to perform. A query is a logical expression that is very similar
        to a SQL `SELECT` statement. Values in the search query can be turned into
        parameters specified in the `query_param` arguments list to prevent having
        to manually insert search values into the query string.

        For example, a value of `:amount` would represent the `amount` value in
        `query_params` object.
    - name: query_params
      type: map[STRING]ANY
      REQUIRED: false
      comment: |-
        Set of arguments corresponding to the parameters specified in the
        `query`. The type of each parameter used in the `query_params` must match
        the type of the corresponding metadata template field.
    - name: ancestor_folder_id
      type: STRING
      REQUIRED: true
      comment: |-
        The ID of the folder that you are restricting the query to. A
        value of zero will return results from all folders you have access
        to. A non-zero value will only return results found in the folder
        corresponding to the ID or in any of its subfolders.
    - name: order_by
      type: "[]ANY"
      REQUIRED: false
      comment: |-
        A list of template fields and directions to sort the metadata query
        results by.

        The ordering `direction` must be the same for each item in the array.
    - name: limit
      type: INT
      REQUIRED: false
      comment: |-
        A value between 0 and 100 that indicates the maximum number of results
        to return for a single request. This only specifies a maximum
        boundary and will not guarantee the minimum number of results
        returned.
    - name: marker
      type: STRING
      REQUIRED: false
      comment: Marker to use for requesting the next page.
    - name: fields
      type: "[]STRING"
      REQUIRED: false
      comment: |-
        By default, this endpoint returns only the most basic info about the items for
        which the query matches. This attribute can be used to specify a list of
        additional attributes to return for any item, including its metadata.

        This attribute takes a list of item fields, metadata template identifiers,
        or metadata template field identifiers.

        For example:

        * `created_by` will add the details of the user who created the item to
        the response.
        * `metadata.<scope>.<templateKey>` will return the mini-representation
        of the metadata instance identified by the `scope` and `templateKey`.
        * `metadata.<scope>.<templateKey>.<field>` will return all the mini-representation
        of the metadata instance identified by the `scope` and `templateKey` plus
        the field specified by the `field` name. Multiple fields for the same
        `scope` and `templateKey` can be defined.
  MetadataQueryResultItem:
    - name: variant_File--Full
      type: OBJECT
      REQUIRED: false
    - name: variant_Folder--Full
      type: OBJECT
      REQUIRED: false
  MetadataQueryResults:
    - name: entries
      type: "[]STRUCT(MetadataQueryResultItem)"
      REQUIRED: false
      comment: |-
        The mini representation of the files and folders that match the search
        terms.

        By default, this endpoint returns only the most basic info about the
        items. To get additional fields for each item, including any of the
        metadata, use the `fields` attribute in the query.
    - name: limit
      type: INT
      REQUIRED: false
      comment: |-
        The limit that was used for this search. This will be the same as the
        `limit` query parameter unless that value exceeded the maximum value
        allowed.
    - name: next_marker
      type: STRING
      REQUIRED: false
      comment: The marker for the start of the next page of results.
  Metadatas:
    - name: entries
      type: "[]STRUCT(Metadata)"
      REQUIRED: false
      comment: A list of metadata instances, as applied to this file or folder.
    - name: limit
      type: INT
      REQUIRED: false
      comment: The limit that was used for this page of results.
  MetadataTaxonomy:
    - name: id
      type: STRING
      REQUIRED: true
      comment: A unique identifier of the metadata taxonomy.
    - name: key
      type: STRING
      REQUIRED: false
      comment: |-
        A unique identifier of the metadata taxonomy. The identifier must be unique within
        the namespace to which it belongs.
    - name: displayName
      type: STRING
      REQUIRED: true
      comment: The display name of the metadata taxonomy. This can be seen in the Box web app.
    - name: namespace
      type: STRING
      REQUIRED: true
      comment: A namespace that the metadata taxonomy is associated with.
    - name: levels
      type: "[]STRUCT(MetadataTaxonomyLevel)"
      REQUIRED: false
      comment: Levels of the metadata taxonomy.
  MetadataTaxonomyLevel:
    - name: displayName
      type: STRING
      REQUIRED: false
      comment: The display name of the level as it is shown to the user.
    - name: description
      type: STRING
      REQUIRED: false
      comment: A description of the level.
    - name: level
      type: INT
      REQUIRED: false
      comment: An index of the level within the taxonomy. Levels are indexed starting from 1.
  MetadataTaxonomyAncestor:
    - name: id
      type: STRING
      REQUIRED: false
      comment: A unique identifier of the metadata taxonomy node.
    - name: displayName
      type: STRING
      REQUIRED: false
      comment: The display name of the metadata taxonomy node.
    - name: level
      type: INT
      REQUIRED: false
      comment: An index of the level to which the node belongs.
  MetadataTaxonomyNode:
    - name: id
      type: STRING
      REQUIRED: true
      comment: A unique identifier of the metadata taxonomy node.
    - name: displayName
      type: STRING
      REQUIRED: true
      comment: The display name of the metadata taxonomy node.
    - name: level
      type: INT
      REQUIRED: true
      comment: An index of the level to which the node belongs.
    - name: parentId
      type: STRING
      REQUIRED: false
      comment: The identifier of the parent node.
    - name: nodePath
      type: "[]STRING"
      REQUIRED: false
      comment: |-
        An array of identifiers for all ancestor nodes.
        Not returned for root-level nodes.
    - name: ancestors
      type: "[]STRUCT(MetadataTaxonomyAncestor)"
      REQUIRED: false
      comment: |-
        An array of objects for all ancestor nodes.
        Not returned for root-level nodes.
  MetadataTemplate:
    - name: id
      type: STRING
      REQUIRED: true
      comment: The ID of the metadata template.
    - name: type
      type: STRING
      REQUIRED: true
      comment: The value will always be `metadata_template`.
    - name: scope
      type: STRING
      REQUIRED: false
      comment: |-
        The scope of the metadata template can either be `global` or
        `enterprise_*`. The `global` scope is used for templates that are
        available to any Box enterprise. The `enterprise_*` scope represents
        templates that have been created within a specific enterprise, where `*`
        will be the ID of that enterprise.
    - name: templateKey
      type: STRING
      REQUIRED: false
      comment: |-
        A unique identifier for the template. This identifier is unique across
        the `scope` of the enterprise to which the metadata template is being
        applied, yet is not necessarily unique across different enterprises.
    - name: displayName
      type: STRING
      REQUIRED: false
      comment: |-
        The display name of the template. This can be seen in the Box web app
        and mobile apps.
    - name: hidden
      type: BOOL
      REQUIRED: false
      comment: |-
        Defines if this template is visible in the Box web app UI, or if
        it is purely intended for usage through the API.
    - name: fields
      type: "[]ANY"
      REQUIRED: false
      comment: |-
        An ordered list of template fields which are part of the template. Each
        field can be a regular text field, date field, number field, as well as a
        single or multi-select list.
    - name: copyInstanceOnItemCopy
      type: BOOL
      REQUIRED: false
      comment: Whether or not to include the metadata when a file or folder is copied.
  OAuth2Error:
    - name: error
      type: STRING
      REQUIRED: false
      comment: The type of the error returned.
    - name: error_description
      type: STRING
      REQUIRED: false
      comment: The type of the error returned.
  Outcome:
    - name: id
      type: STRING
      REQUIRED: true
      comment: ID of a specific outcome.
    - name: collaborators
      type: ANY
      REQUIRED: false
    - name: completion_rule
      type: ANY
      REQUIRED: false
    - name: file_collaborator_role
      type: ANY
      REQUIRED: false
    - name: task_collaborators
      type: ANY
      REQUIRED: false
    - name: role
      type: ANY
      REQUIRED: false
  RealtimeServer:
    - name: type
      type: STRING
      REQUIRED: false
      comment: The value will always be `realtime_server`.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The URL for the server.
    - name: ttl
      type: STRING
      REQUIRED: false
      comment: The time in minutes for which this server is available.
    - name: max_retries
      type: STRING
      REQUIRED: false
      comment: |-
        The maximum number of retries this server will
        allow before a new long poll should be started by
        getting a [new list of server](https://developer.box.com/reference/options-events).
    - name: retry_timeout
      type: INT
      REQUIRED: false
      comment: |-
        The maximum number of seconds without a response
        after which you should retry the long poll connection.

        This helps to overcome network issues where the long
        poll looks to be working but no packages are coming
        through.
  RealtimeServers:
    - name: chunk_size
      type: INT
      REQUIRED: false
      comment: The number of items in this response.
    - name: entries
      type: "[]STRUCT(RealtimeServer)"
      REQUIRED: false
      comment: A list of real-time servers.
  RetentionPolicyAssignment:
    - name: id
      type: STRING
      REQUIRED: true
      comment: The unique identifier for a retention policy assignment.
    - name: type
      type: STRING
      REQUIRED: true
      comment: The value will always be `retention_policy_assignment`.
    - name: retention_policy
      type: ANY
      REQUIRED: false
    - name: assigned_to
      type: OBJECT
      REQUIRED: false
      comment: |-
        The `type` and `id` of the content that is under
        retention. The `type` can either be `folder`
        `enterprise`, or `metadata_template`.
    - name: filter_fields
      type: "[]ANY"
      REQUIRED: false
      comment: |-
        An array of field objects. Values are only returned if the `assigned_to`
        type is `metadata_template`. Otherwise, the array is blank.
    - name: assigned_by
      type: ANY
      REQUIRED: false
    - name: assigned_at
      type: TIMESTAMP
      REQUIRED: false
      comment: |-
        When the retention policy assignment object was
        created.
    - name: start_date_field
      type: STRING
      REQUIRED: false
      comment: |-
        The date the retention policy assignment begins.
        If the `assigned_to` type is `metadata_template`,
        this field can be a date field's metadata attribute key id.
  RetentionPolicyMaxExtensionLengthRequest:
    - name: variant_0
      type: STRING
      REQUIRED: false
    - name: variant_1
      type: STRING
      REQUIRED: false
    - name: variant_2
      type: INT
      REQUIRED: false
  SessionTerminationMessage:
    - name: message
      type: STRING
      REQUIRED: false
      comment: The unique identifier for the termination job status.
  ShieldInformationBarrier:
    - name: id
      type: STRING
      REQUIRED: false
      comment: The unique identifier for the shield information barrier.
    - name: type
      type: STRING
      REQUIRED: false
      comment: The type of the shield information barrier.
    - name: enterprise
