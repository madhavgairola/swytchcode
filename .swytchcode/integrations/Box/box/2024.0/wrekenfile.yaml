  box.user.avatar.create:
    SUMMARY: Add or update user avatar
    DESC: Adds or updates a user avatar.
    HTTP:
      METHOD: POST
      ENDPOINT: /users/{user_id}/avatar
      HEADERS:
        Content-Type: multipart/form-data
        Authorization: bearer_token
      CONTENT_TYPE: multipart/form-data
      ACCEPT: application/json
      BODYTYPE: form-data
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - user_id:
          TYPE: STRING
          LOCATION: path
      - pic:
          TYPE: STRING
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(UserAvatar)
        RETURNVAR: box_user_avatar_create
        STATUS: 200
      - RETURNTYPE: STRUCT(UserAvatar)
        RETURNVAR: box_user_avatar_create_201
        STATUS: 201
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_user_avatar_create_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 400
        WHEN: |-
          `bad_request`: Returns an error when:
            * An image is not included in the request
            * The uploaded file is empty
            * The image size exceeds 1024 * 1024 pixels or 1MB
            * The file extension is other than `.jpg` or `.png`. (HTTP 400)
      - TYPE: STRUCT(ClientError)
        STATUS: 403
        WHEN: |-
          `forbidden`: Returns an error if the user does not have permissions
          necessary to upload an avatar or is not activated. (HTTP 403)
      - TYPE: STRUCT(ClientError)
        STATUS: 404
        WHEN: |-
          `not_found`: Returns an error if the user
          does not exist or cannot be found. (HTTP 404)
