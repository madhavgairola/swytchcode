    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - integration_mapping_id:
          TYPE: STRING
          LOCATION: path
      - body:
          TYPE: STRUCT(api.integration_mapping.slack.updateRequest)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: OBJECT
        RETURNVAR: box_integration_mapping_slack_update
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_integration_mapping_slack_update_NaN
        STATUS: .nan
