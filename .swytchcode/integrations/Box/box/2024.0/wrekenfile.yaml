      - RETURNTYPE: OBJECT
        RETURNVAR: box_folder_metadata_update
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_folder_metadata_update_NaN
        STATUS: .nan
    ERRORS:
