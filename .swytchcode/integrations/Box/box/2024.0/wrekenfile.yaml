      type: ANY
      REQUIRED: true
    - name: url
      type: STRING
      REQUIRED: false
      comment: |-
        The generated URL for this file request. This URL can be shared
        with users to let them upload files to the associated folder.
    - name: etag
      type: STRING
      REQUIRED: false
      comment: |-
        The HTTP `etag` of this file. This can be used in combination with
        the `If-Match` header when updating a file request. By providing that
        header, a change will only be performed on the  file request if the `etag`
        on the file request still matches the `etag` provided in the `If-Match`
        header.
    - name: created_by
      type: ANY
      REQUIRED: false
    - name: created_at
      type: TIMESTAMP
      REQUIRED: true
      comment: The date and time when the file request was created.
    - name: updated_by
      type: ANY
      REQUIRED: false
    - name: updated_at
      type: TIMESTAMP
      REQUIRED: true
      comment: The date and time when the file request was last updated.
