    RETURNS:
      - RETURNTYPE: OBJECT
        RETURNVAR: box_comment_create_201
        STATUS: 201
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_comment_create_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.comment.create
  box.collaboration.get:
    SUMMARY: Get collaboration
    DESC: Retrieves a single collaboration.
    HTTP:
      METHOD: GET
      ENDPOINT: /collaborations/{collaboration_id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - collaboration_id:
          TYPE: STRING
          LOCATION: path
      - fields:
          TYPE: "[]STRING"
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(Collaboration)
        RETURNVAR: box_collaboration_get
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_collaboration_get_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.collaboration.get
  box.collaboration.update:
    SUMMARY: Update collaboration
    DESC: |-
      Updates a collaboration.
      Can be used to change the owner of an item, or to
      accept collaboration invites. In case of accepting collaboration invite, role is not required.
    HTTP:
      METHOD: PUT
      ENDPOINT: /collaborations/{collaboration_id}
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(api.collaboration.updateRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - collaboration_id:
          TYPE: STRING
          LOCATION: path
      - body:
          TYPE: STRUCT(api.collaboration.updateRequest)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(Collaboration)
        RETURNVAR: box_collaboration_update
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_collaboration_update_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 403
        WHEN: |-
          Returns an error if the authenticated user does not have the right
          permissions to update the collaboration.

          Additionally, this error may occur when attempting to update the
          `expires_at` field for the collaboration without the **Automatically
          remove invited collaborators: Allow folder owners to extend the expiry
          date** setting enabled in the admin dashboard of the enterprise. (HTTP 403)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.collaboration.update
  box.collaboration.delete:
    SUMMARY: Remove collaboration
    DESC: Deletes a single collaboration.
    HTTP:
      METHOD: DELETE
      ENDPOINT: /collaborations/{collaboration_id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - collaboration_id:
          TYPE: STRING
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_collaboration_delete_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.collaboration.delete
  box.collaboration.list:
    SUMMARY: List pending collaborations
    DESC: Retrieves all pending collaboration invites for this user.
    HTTP:
      METHOD: GET
      ENDPOINT: /collaborations
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - status:
          TYPE: STRING
          LOCATION: query
      - fields:
          TYPE: "[]STRING"
          REQUIRED: false
          LOCATION: query
      - offset:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          DEFAULT: 0
      - limit:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: OBJECT
        RETURNVAR: box_collaboration_list
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_collaboration_list_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.collaboration.list
  box.collaboration.create:
    SUMMARY: Create collaboration
    DESC: |-
      Adds a collaboration for a single user or a single group to a file
      or folder.

      Collaborations can be created using email address, user IDs, or a
      group IDs.

      If a collaboration is being created with a group, access to
      this endpoint is dependent on the group's ability to be invited.

      If collaboration is in `pending` status, field `name` is redacted when:
      - a collaboration was created using `user_id`,
      - a collaboration was created using `login`.
    HTTP:
      METHOD: POST
      ENDPOINT: /collaborations
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(api.collaboration.createRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - fields:
          TYPE: "[]STRING"
          REQUIRED: false
          LOCATION: query
      - notify:
          TYPE: BOOL
          REQUIRED: false
          LOCATION: query
      - body:
          TYPE: STRUCT(api.collaboration.createRequest)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(Collaboration)
        RETURNVAR: box_collaboration_create_201
        STATUS: 201
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_collaboration_create_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 403
        WHEN: |-
          Returns an error when the user does not have the
          right permissions to create the collaboration.

          * `forbidden_by_policy`: Creating a
          collaboration is forbidden due to information
          barrier restrictions. (HTTP 403)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.collaboration.create
  box.search.list:
    SUMMARY: Search for content
    DESC: |-
      Searches for files, folders, web links, and shared files across the
      users content or across the entire enterprise.
    HTTP:
      METHOD: GET
      ENDPOINT: /search
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - query:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - scope:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
          DEFAULT: user_content
      - file_extensions:
          TYPE: "[]STRING"
          REQUIRED: false
          LOCATION: query
      - created_at_range:
          TYPE: "[]STRING"
          REQUIRED: false
          LOCATION: query
      - updated_at_range:
          TYPE: "[]STRING"
          REQUIRED: false
          LOCATION: query
      - size_range:
          TYPE: "[]INT"
          REQUIRED: false
          LOCATION: query
      - owner_user_ids:
          TYPE: "[]STRING"
          REQUIRED: false
          LOCATION: query
      - recent_updater_user_ids:
          TYPE: "[]STRING"
          REQUIRED: false
          LOCATION: query
      - ancestor_folder_ids:
          TYPE: "[]STRING"
          REQUIRED: false
          LOCATION: query
      - content_types:
          TYPE: "[]STRING"
          REQUIRED: false
          LOCATION: query
      - type:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - trash_content:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
          DEFAULT: non_trashed_only
      - mdfilters:
          TYPE: "[]STRUCT(MetadataFilter)"
          REQUIRED: false
          LOCATION: query
      - sort:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
          DEFAULT: relevance
      - direction:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
          DEFAULT: DESC
      - limit:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          DEFAULT: 30
      - include_recent_shared_links:
          TYPE: BOOL
          REQUIRED: false
          LOCATION: query
          DEFAULT: false
      - fields:
          TYPE: "[]STRING"
          REQUIRED: false
          LOCATION: query
      - offset:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          DEFAULT: 0
      - deleted_user_ids:
          TYPE: "[]STRING"
          REQUIRED: false
          LOCATION: query
      - deleted_at_range:
          TYPE: "[]STRING"
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: OBJECT
        RETURNVAR: box_search_list
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_search_list_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 400
        WHEN: |-
          Returns an error when the request was not valid. This can have multiple
          reasons and the `context_info` object will provide you with more details.

          * `missing_parameter` - Please provide at least the `query` or `mdfilters`
            query parameter in a search.
          * `invalid_parameter` - Any of the fields might not be in the right
            format. This could for example mean that one of the RFC3339 dates is
            incorrect, or a string is provided where an integer is expected. (HTTP 400)
      - TYPE: STRUCT(ClientError)
        STATUS: 403
        WHEN: |-
          Returns an error when the user does not have the permission to make
          this API call.

          * The developer provided a `scope` of `enterprise_content` but did
            not request this scope to be enabled for the user through our
            support channels. (HTTP 403)
      - TYPE: STRUCT(ClientError)
        STATUS: 404
        WHEN: |-
          Returns an error when the user does not have access to an item
          mentioned in the request.

          * The developer provided a folder ID in `ancestor_folder_ids`
            that either does not exist or the user does not have access to. (HTTP 404)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.search.list
  box.task.create:
    SUMMARY: Create task
    DESC: |-
      Creates a single task on a file. This task is not assigned to any user and
      will need to be assigned separately.
    HTTP:
      METHOD: POST
      ENDPOINT: /tasks
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(api.task.createRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(api.task.createRequest)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(Task)
        RETURNVAR: box_task_create_201
        STATUS: 201
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_task_create_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 400
        WHEN: |-
          Returned if the request parameters or body is not valid.

          * `bad_request` when the body does not contain a valid request. This may
          be because the `action` or `completion_rule` are not one of the allowed
          values. (HTTP 400)
      - TYPE: STRUCT(ClientError)
        STATUS: 403
        WHEN: |-
          Returns an error when the user does not have the permission to create a
