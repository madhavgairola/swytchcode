    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 400
        WHEN: |-
          Returned if the request parameters or body is not valid.

          * `bad_request` when the body does not contain a valid request. In many
          cases this response will include extra details on what fields are missing. (HTTP 400)
      - TYPE: STRUCT(ClientError)
        STATUS: 403
        WHEN: |-
          Returned when the user does not have the permission to delete the metadata
          taxonomy node. This can happen for a few reasons, most commonly when the user
          does not have (co-)admin permissions, or the user doesn't have access to
          the provided namespace. (HTTP 403)
      - TYPE: STRUCT(ClientError)
        STATUS: 404
        WHEN: Returned if the metadata taxonomy node does not exist. (HTTP 404)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
