          LOCATION: path
      - fields:
          TYPE: "[]STRING"
          REQUIRED: false
          LOCATION: query
      - limit:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
      - offset:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          DEFAULT: 0
    RETURNS:
      - RETURNTYPE: OBJECT
        RETURNVAR: box_file_comments_get
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_file_comments_get_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.file.comments.get
  box.file.tasks.get:
    SUMMARY: List tasks on file
    DESC: |-
      Retrieves a list of all the tasks for a file. This
      endpoint does not support pagination.
    HTTP:
      METHOD: GET
      ENDPOINT: /files/{file_id}/tasks
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - file_id:
          TYPE: STRING
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(Tasks)
        RETURNVAR: box_file_tasks_get
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_file_tasks_get_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 404
        WHEN: |-
          Returns an error when the file could not be found or the user does not
          have access to the file. (HTTP 404)
      - TYPE: STRUCT(ClientError)
        STATUS: 405
        WHEN: Returns an error when the `file_id` was not provided. (HTTP 405)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: |-
          Returns an error when an attempt was made to retrieve tasks for the file
          with ID `0`. (HTTP 500)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.file.tasks.get
  box.file.trash.get:
    SUMMARY: Get trashed file
    DESC: |-
      Retrieves a file that has been moved to the trash.

      Please note that only if the file itself has been moved to the
      trash can it be retrieved with this API call. If instead one of
      its parent folders was moved to the trash, only that folder
      can be inspected using the
      [`GET /folders/:id/trash`](https://developer.box.com/reference/get-folders-id-trash) API.

      To list all items that have been moved to the trash, please
      use the [`GET /folders/trash/items`](https://developer.box.com/reference/get-folders-trash-items/)
      API.
    HTTP:
      METHOD: GET
      ENDPOINT: /files/{file_id}/trash
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - file_id:
          TYPE: STRING
          LOCATION: path
      - fields:
          TYPE: "[]STRING"
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(TrashFile)
        RETURNVAR: box_file_trash_get
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_file_trash_get_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 404
        WHEN: |-
          Returns an error if the file can not be found directly
          in the trash.

          Please note that a `HTTP 404` is also returned if any of
          the file's parent folders have been moved to the trash.

          In that case, only that parent folder can be inspected using
          the [`GET /folders/:id/trash`](https://developer.box.com/reference/get-folders-id-trash) API. (HTTP 404)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.file.trash.get
  box.file.trash.delete:
    SUMMARY: Permanently remove file
    DESC: |-
      Permanently deletes a file that is in the trash.
      This action cannot be undone.
    HTTP:
      METHOD: DELETE
      ENDPOINT: /files/{file_id}/trash
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - file_id:
          TYPE: STRING
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_file_trash_delete_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 404
        WHEN: Returns an error if the file is not in the trash. (HTTP 404)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.file.trash.delete
  box.file.versions.get:
