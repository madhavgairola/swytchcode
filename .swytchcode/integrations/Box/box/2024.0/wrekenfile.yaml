  box.user.get:
    SUMMARY: Get user
    DESC: |-
      Retrieves information about a user in the enterprise.

      The application and the authenticated user need to
      have the permission to look up users in the entire
      enterprise.

      This endpoint also returns a limited set of information
      for external users who are collaborated on content
      owned by the enterprise for authenticated users with the
      right scopes. In this case, disallowed fields will return
      null instead.
    HTTP:
      METHOD: GET
      ENDPOINT: /users/{user_id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - user_id:
          TYPE: STRING
          LOCATION: path
      - fields:
          TYPE: "[]STRING"
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: OBJECT
        RETURNVAR: box_user_get
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_user_get_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.user.get
  box.user.update:
    SUMMARY: Update user
    DESC: |-
      Updates a managed or app user in an enterprise. This endpoint
      is only available to users and applications with the right
      admin permissions.
    HTTP:
      METHOD: PUT
      ENDPOINT: /users/{user_id}
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(api.user.updateRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - user_id:
          TYPE: STRING
          LOCATION: path
      - fields:
          TYPE: "[]STRING"
          REQUIRED: false
          LOCATION: query
      - body:
          TYPE: STRUCT(api.user.updateRequest)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: OBJECT
        RETURNVAR: box_user_update
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_user_update_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 400
        WHEN: |-
          Returns an error if some of the parameters are missing or
          not valid.

          * `invalid_parameter` when a parameter is formatted incorrectly,
            for example when the `notification_email` has an incorrectly formatted
            email address. (HTTP 400)
      - TYPE: STRUCT(ClientError)
        STATUS: 403
        WHEN: |-
          Returns an error if the user is not allowed to make the changes.

          * `access_denied_insufficient_permissions` when the user does not have
            the right permissions, for example when updating the notification email
            is turned off for the enterprise.
          * `denied_by_policy` when the user does not have the right permissions
            due to the information barrier restrictions. (HTTP 403)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.user.update
  box.user.delete:
    SUMMARY: Delete user
    DESC: |-
      Deletes a user. By default, this operation fails if the user
      still owns any content.
      To proceed, move their owned content first, or use the `force` parameter to delete
      the user and their files.
