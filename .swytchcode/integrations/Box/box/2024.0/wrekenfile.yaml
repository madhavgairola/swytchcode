      MODE: sync
    INPUTS:
      - marker:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - limit:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: OBJECT
        RETURNVAR: box_metadata_template_global_list
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_metadata_template_global_list_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 400
        WHEN: Returned when the request parameters are not valid. (HTTP 400)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.metadata_template.global.list
  box.metadata_template.enterprise.list:
    SUMMARY: List all metadata templates for enterprise
    DESC: |-
      Used to retrieve all metadata templates created to be used specifically within
      the user's enterprise.
    HTTP:
      METHOD: GET
      ENDPOINT: /metadata_templates/enterprise
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - marker:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - limit:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: OBJECT
        RETURNVAR: box_metadata_template_enterprise_list
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_metadata_template_enterprise_list_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 400
        WHEN: Returned when the request parameters are not valid. (HTTP 400)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.metadata_template.enterprise.list
  box.metadata_template.schema.create:
    SUMMARY: Create metadata template
    DESC: |-
      Creates a new metadata template that can be applied to
      files and folders.
    HTTP:
      METHOD: POST
      ENDPOINT: /metadata_templates/schema
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(api.metadata_template.schema.createRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(api.metadata_template.schema.createRequest)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(MetadataTemplate)
        RETURNVAR: box_metadata_template_schema_create_201
        STATUS: 201
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_metadata_template_schema_create_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 400
        WHEN: |-
          Returned if the request parameters or body is not valid.

          * `bad_request` when the body does not contain a valid request. In many
          cases this response will include extra details on what fields are missing. (HTTP 400)
      - TYPE: STRUCT(ClientError)
        STATUS: 403
        WHEN: |-
          Returned when the user does not have the permission to create the metadata
          template. This can happen for a few reasons, most commonly when the user
          does not have (co-)admin permissions, or the application tries to create a
          template with the `global` scope. (HTTP 403)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.metadata_template.schema.create
  box.metadata_template.schemaclassifications.create:
    SUMMARY: Add initial classifications
    DESC: |-
      When an enterprise does not yet have any classifications, this API call
      initializes the classification template with an initial set of
      classifications.

      If an enterprise already has a classification, the template will already
      exist and instead an API call should be made to add additional
      classifications.
