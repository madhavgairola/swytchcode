  box.metadata_template.schema.list:
    SUMMARY: List all classifications
    DESC: |-
      Retrieves the classification metadata template and lists all the
      classifications available to this enterprise.

      This API can also be called by including the enterprise ID in the
      URL explicitly, for example
      `/metadata_templates/enterprise_12345/securityClassification-6VMVochwUWo/schema`.
    HTTP:
      METHOD: GET
      ENDPOINT: /metadata_templates/enterprise/securityClassification-6VMVochwUWo/schema
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    RETURNS:
      - RETURNTYPE: STRUCT(ClassificationTemplate)
        RETURNVAR: box_metadata_template_schema_list
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_metadata_template_schema_list_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 400
        WHEN: Returned if any of the request parameters are not valid. (HTTP 400)
      - TYPE: STRUCT(ClientError)
        STATUS: 404
        WHEN: |-
          Returned when a template name is not correct. Please make sure
          the URL for the request is correct. (HTTP 404)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.metadata_template.schema.list
  box.metadata_template.schemaadd.update:
    SUMMARY: Add classification
    DESC: |-
      Adds one or more new classifications to the list of classifications
      available to the enterprise.

      This API can also be called by including the enterprise ID in the
      URL explicitly, for example
      `/metadata_templates/enterprise_12345/securityClassification-6VMVochwUWo/schema`.
    HTTP:
      METHOD: PUT
      ENDPOINT: /metadata_templates/enterprise/securityClassification-6VMVochwUWo/schema#add
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(api.metadata_template.schemaadd.updateRequest)
    EXECUTION:
