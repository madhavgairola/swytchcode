        RETURNVAR: box_retention_policy_assignment_create_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 400
        WHEN: |-
          Returns an error if an `id` is specified while assigning the
