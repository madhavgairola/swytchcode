      METHOD: GET
      ENDPOINT: /folders/trash/items
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - fields:
          TYPE: "[]STRING"
          REQUIRED: false
          LOCATION: query
      - limit:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
      - offset:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          DEFAULT: 0
      - usemarker:
          TYPE: BOOL
          REQUIRED: false
          LOCATION: query
      - marker:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - direction:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - sort:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: OBJECT
        RETURNVAR: box_folder_items_list
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_folder_items_list_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 400
        WHEN: |-
          Returns an error if some of the parameters are missing or
          not valid.

          * `invalid_parameter` can appear when the `sort`, `direction` or `offset`
          parameter is provided when using marker based pagination, or when the
          `marker` parameter is provided but `usemarker` is set to `false` or
          `null`. (HTTP 400)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.folder.items.list
