  api.group.createRequest:
    - name: name
      type: STRING
      REQUIRED: true
      comment: |-
        The name of the new group to be created. This name must be unique
        within the enterprise.
    - name: provenance
      type: STRING
      REQUIRED: false
      comment: |-
        Keeps track of which external source this group is
        coming, for example `Active Directory`, or `Okta`.

        Setting this will also prevent Box admins from editing
        the group name and its members directly via the Box
        web application.

        This is desirable for one-way syncing of groups.
    - name: external_sync_identifier
      type: STRING
      REQUIRED: false
      comment: |-
        An arbitrary identifier that can be used by
        external group sync tools to link this Box Group to
        an external group.

        Example values of this field
        could be an **Active Directory Object ID** or a **Google
        Group ID**.

        We recommend you use of this field in
        order to avoid issues when group names are updated in
        either Box or external systems.
    - name: description
      type: STRING
      REQUIRED: false
      comment: A human readable description of the group.
    - name: invitability_level
      type: STRING
      REQUIRED: false
      comment: |-
        Specifies who can invite the group to collaborate
        on folders.

        When set to `admins_only` the enterprise admin, co-admins,
        and the group's admin can invite the group.

        When set to `admins_and_members` all the admins listed
        above and group members can invite the group.

        When set to `all_managed_users` all managed users in the
        enterprise can invite the group.
    - name: member_viewability_level
      type: STRING
      REQUIRED: false
      comment: |-
        Specifies who can see the members of the group.

        * `admins_only` - the enterprise admin, co-admins, group's
          group admin.
        * `admins_and_members` - all admins and group members.
        * `all_managed_users` - all managed users in the
          enterprise.
  api.group.terminateSessions.createRequest:
    - name: group_ids
      type: "[]STRING"
      REQUIRED: true
      comment: A list of group IDs.
  api.group.updateRequest:
    - name: name
      type: STRING
      REQUIRED: false
      comment: |-
        The name of the new group to be created. Must be unique within the
        enterprise.
    - name: provenance
      type: STRING
      REQUIRED: false
      comment: |-
        Keeps track of which external source this group is
        coming, for example `Active Directory`, or `Okta`.

        Setting this will also prevent Box admins from editing
        the group name and its members directly via the Box
        web application.

        This is desirable for one-way syncing of groups.
    - name: external_sync_identifier
      type: STRING
      REQUIRED: false
      comment: |-
        An arbitrary identifier that can be used by
        external group sync tools to link this Box Group to
        an external group.

        Example values of this field
        could be an **Active Directory Object ID** or a **Google
        Group ID**.

        We recommend you use of this field in
        order to avoid issues when group names are updated in
        either Box or external systems.
    - name: description
      type: STRING
      REQUIRED: false
      comment: A human readable description of the group.
    - name: invitability_level
      type: STRING
      REQUIRED: false
      comment: |-
        Specifies who can invite the group to collaborate
        on folders.

        When set to `admins_only` the enterprise admin, co-admins,
        and the group's admin can invite the group.

        When set to `admins_and_members` all the admins listed
        above and group members can invite the group.

        When set to `all_managed_users` all managed users in the
        enterprise can invite the group.
    - name: member_viewability_level
      type: STRING
      REQUIRED: false
      comment: |-
        Specifies who can see the members of the group.

        * `admins_only` - the enterprise admin, co-admins, group's
          group admin.
        * `admins_and_members` - all admins and group members.
        * `all_managed_users` - all managed users in the
          enterprise.
  api.group_membership.createRequest:
    - name: user
      type: OBJECT
      REQUIRED: true
      comment: The user to add to the group.
    - name: group
      type: OBJECT
      REQUIRED: true
      comment: The group to add the user to.
    - name: role
      type: STRING
      REQUIRED: false
      comment: The role of the user in the group.
    - name: configurable_permissions
      type: map[STRING]BOOL
      REQUIRED: false
      comment: |-
        Custom configuration for the permissions an admin
        if a group will receive. This option has no effect
        on members with a role of `member`.

        Setting these permissions overwrites the default
        access levels of an admin.

        Specifying a value of `null` for this object will disable
        all configurable permissions. Specifying permissions will set
        them accordingly, omitted permissions will be enabled by default.
  api.group_membership.updateRequest:
    - name: role
      type: STRING
      REQUIRED: false
      comment: The role of the user in the group.
    - name: configurable_permissions
      type: map[STRING]BOOL
