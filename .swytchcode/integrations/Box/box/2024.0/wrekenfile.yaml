VERSION: 2.0.2
DEFAULTS:
  bearer_token: BEARER <ACCESS_TOKEN>
  w_base_url: https://api.box.com/2.0
METHODS:
  box.authorize.list:
    SUMMARY: Authorize user
    DESC: |-
      Authorize a user by sending them through the [Box](https://box.com)
      website and request their permission to act on their behalf.

      This is the first step when authenticating a user using
      OAuth 2.0. To request a user's authorization to use the Box APIs
      on their behalf you will need to send a user to the URL with this
      format.
    HTTP:
      METHOD: GET
      ENDPOINT: /authorize
      HEADERS: {}
      CONTENT_TYPE: application/json
      ACCEPT: text/html
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - response_type:
          TYPE: STRING
          LOCATION: query
      - client_id:
          TYPE: STRING
          LOCATION: query
      - redirect_uri:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - state:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - scope:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: ANY
        RETURNVAR: box_authorize_list
        STATUS: 200
      - RETURNTYPE: ANY
        RETURNVAR: box_authorize_list_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: ANY
        STATUS: 500
        WHEN: Does not return any data, but rather should be used in the browser. (HTTP default)
    CANONICAL_ID: box.authorize.list
  box.oauth2.token.create:
    SUMMARY: Request access token
    DESC: |-
      Request an Access Token using either a client-side obtained OAuth 2.0
      authorization code or a server-side JWT assertion.

      An Access Token is a string that enables Box to verify that a
      request belongs to an authorized session. In the normal order of
      operations you will begin by requesting authentication from the
      [authorize](https://developer.box.com/reference/get-authorize) endpoint and Box will send you an
      authorization code.

      You will then send this code to this endpoint to exchange it for
      an Access Token. The returned Access Token can then be used to to make
      Box API calls.
    HTTP:
      METHOD: POST
      ENDPOINT: /oauth2/token
      HEADERS:
        Content-Type: application/x-www-form-urlencoded
      CONTENT_TYPE: application/x-www-form-urlencoded
      ACCEPT: application/json
      BODYTYPE: x-www-form-urlencoded
    EXECUTION:
      KIND: http
      MODE: sync
    RETURNS:
      - RETURNTYPE: STRUCT(AccessToken)
        RETURNVAR: box_oauth2_token_create
        STATUS: 200
      - RETURNTYPE: STRUCT(OAuth2Error)
        RETURNVAR: box_oauth2_token_create_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(OAuth2Error)
        STATUS: 400
        WHEN: An authentication error. (HTTP 400)
      - TYPE: STRUCT(OAuth2Error)
        STATUS: 500
        WHEN: An authentication error. (HTTP default)
    CANONICAL_ID: box.oauth2.token.create
  box.oauth2.tokenrefresh.create:
    SUMMARY: Refresh access token
    DESC: Refresh an Access Token using its client ID, secret, and refresh token.
    HTTP:
      METHOD: POST
      ENDPOINT: /oauth2/token#refresh
      HEADERS:
        Content-Type: application/x-www-form-urlencoded
      CONTENT_TYPE: application/x-www-form-urlencoded
      ACCEPT: application/json
      BODYTYPE: x-www-form-urlencoded
    EXECUTION:
      KIND: http
      MODE: sync
    RETURNS:
      - RETURNTYPE: STRUCT(AccessToken)
        RETURNVAR: box_oauth2_tokenrefresh_create
        STATUS: 200
      - RETURNTYPE: STRUCT(OAuth2Error)
        RETURNVAR: box_oauth2_tokenrefresh_create_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(OAuth2Error)
        STATUS: 400
        WHEN: An authentication error. (HTTP 400)
      - TYPE: STRUCT(OAuth2Error)
        STATUS: 500
        WHEN: An authentication error. (HTTP default)
    CANONICAL_ID: box.oauth2.tokenrefresh.create
  box.oauth2.revoke.create:
    SUMMARY: Revoke access token
    DESC: |-
      Revoke an active Access Token, effectively logging a user out
      that has been previously authenticated.
    HTTP:
      METHOD: POST
      ENDPOINT: /oauth2/revoke
      HEADERS:
        Content-Type: application/x-www-form-urlencoded
      CONTENT_TYPE: application/x-www-form-urlencoded
      ACCEPT: application/json
      BODYTYPE: x-www-form-urlencoded
    EXECUTION:
      KIND: http
      MODE: sync
    RETURNS:
      - RETURNTYPE: STRUCT(OAuth2Error)
        RETURNVAR: box_oauth2_revoke_create_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(OAuth2Error)
        STATUS: 400
        WHEN: An authentication error. (HTTP 400)
      - TYPE: STRUCT(OAuth2Error)
        STATUS: 500
        WHEN: An authentication error. (HTTP default)
    CANONICAL_ID: box.oauth2.revoke.create
  box.file.get:
    SUMMARY: Get file information
    DESC: Retrieves the details about a file.
    HTTP:
      METHOD: GET
      ENDPOINT: /files/{file_id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - file_id:
          TYPE: STRING
          LOCATION: path
      - fields:
          TYPE: "[]STRING"
          REQUIRED: false
          LOCATION: query
      - if-none-match:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - boxapi:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - x-rep-hints:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
    RETURNS:
      - RETURNTYPE: OBJECT
        RETURNVAR: box_file_get
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_file_get_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 401
        WHEN: |-
          Returned when the access token provided in the `Authorization` header
          is not recognized or not provided. (HTTP 401)
      - TYPE: STRUCT(ClientError)
        STATUS: 404
        WHEN: |-
          Returned if the file is not found, or the user does not
          have access to the file. (HTTP 404)
      - TYPE: STRUCT(ClientError)
        STATUS: 405
        WHEN: Returned if the `file_id` is not in a recognized format. (HTTP 405)
      - TYPE: STRUCT(ClientError)
        STATUS: 415
        WHEN: |-
          Returns an error if an action is performed on a file with an
          incorrect media type.

          * `unsupported_media_type` when requesting an `expiring_embed_link`
            for a file that is not supported by Box Embed. (HTTP 415)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.file.get
  box.file.create:
    SUMMARY: Restore file
    DESC: |-
      Restores a file that has been moved to the trash.

      An optional new parent ID can be provided to restore the file to in case the
      original folder has been deleted.
    HTTP:
      METHOD: POST
      ENDPOINT: /files/{file_id}
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(api.file.createRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - file_id:
          TYPE: STRING
          LOCATION: path
      - fields:
          TYPE: "[]STRING"
          REQUIRED: false
          LOCATION: query
      - body:
          TYPE: STRUCT(api.file.createRequest)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(TrashFileRestored)
        RETURNVAR: box_file_create_201
        STATUS: 201
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_file_create_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 403
        WHEN: |-
          Returns an error if the user does not have access to the folder
          the file is being restored to, or the user does not have permission
          to restore files from the trash. (HTTP 403)
      - TYPE: STRUCT(ClientError)
        STATUS: 404
        WHEN: Returns an error if the file is not in the trash. (HTTP 404)
      - TYPE: STRUCT(ClientError)
        STATUS: 409
        WHEN: |-
          Returns an error if there is an file with the same name
          in the folder the file is being restored to. (HTTP 409)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.file.create
  box.file.update:
    SUMMARY: Update file
    DESC: |-
      Updates a file. This can be used to rename or move a file,
      create a shared link, or lock a file.
    HTTP:
      METHOD: PUT
      ENDPOINT: /files/{file_id}
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(api.file.updateRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - file_id:
          TYPE: STRING
          LOCATION: path
      - fields:
          TYPE: "[]STRING"
          REQUIRED: false
          LOCATION: query
      - if-match:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - body:
          TYPE: STRUCT(api.file.updateRequest)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: OBJECT
        RETURNVAR: box_file_update
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_file_update_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 400
        WHEN: Returned when the new retention time > maximum retention length. (HTTP 400)
      - TYPE: STRUCT(ClientError)
        STATUS: 401
        WHEN: |-
          Returned when the access token provided in the `Authorization` header
          is not recognized or not provided. (HTTP 401)
      - TYPE: STRUCT(ClientError)
        STATUS: 403
        WHEN: |-
          Returned if the user does not have all the permissions to complete the
          update.

          * `access_denied_insufficient_permissions` returned
          when the authenticated user does not have access
          to the destination folder to move the file to.
          * Returned when retention time is shorter or equal to current retention
          timestamp.
          * Returned when a `file_id` that is not under retention is entered.
          * Returned when a file that is retained but the disposition action is set
          to `remove_retention`
          * `forbidden_by_policy` is returned if copying a folder is
          forbidden due to information barrier restrictions. (HTTP 403)
      - TYPE: STRUCT(ClientError)
        STATUS: 404
        WHEN: |-
          Returned if the file is not found, or the user does not
          have access to the file. (HTTP 404)
      - TYPE: STRUCT(ClientError)
        STATUS: 405
        WHEN: Returned if the `file_id` is not in a recognized format. (HTTP 405)
      - TYPE: STRUCT(ClientError)
        STATUS: 412
        WHEN: |-
          Returns an error when the `If-Match` header does not match
          the current `etag` value of the file. This indicates that the file
          has changed since it was last requested. (HTTP 412)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.file.update
  box.file.delete:
    SUMMARY: Delete file
    DESC: |-
      Deletes a file, either permanently or by moving it to
      the trash.

      The enterprise settings determine whether the item will
      be permanently deleted from Box or moved to the trash.
    HTTP:
      METHOD: DELETE
      ENDPOINT: /files/{file_id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - file_id:
          TYPE: STRING
          LOCATION: path
      - if-match:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
    RETURNS:
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_file_delete_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 401
        WHEN: |-
          Returned when the access token provided in the `Authorization` header
          is not recognized or not provided. (HTTP 401)
      - TYPE: STRUCT(ClientError)
        STATUS: 404
        WHEN: |-
          Returned if the file is not found or has already been deleted, or the user
          does not have access to the file. (HTTP 404)
      - TYPE: STRUCT(ClientError)
        STATUS: 405
        WHEN: Returned if the `file_id` is not in a recognized format. (HTTP 405)
      - TYPE: STRUCT(ClientError)
        STATUS: 412
        WHEN: |-
          Returns an error when the `If-Match` header does not match
          the current `etag` value of the file. This indicates that the file
          has changed since it was last requested. (HTTP 412)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.file.delete
  box.file.appItemAssociations.get:
    SUMMARY: List file app item associations
    DESC: |-
      **This is a beta feature, which means that its availability might be limited.**
      Returns all app items the file is associated with. This includes app items
      associated with ancestors of the file. Assuming the context user has access
      to the file, the type/ids are revealed even if the context user does not
      have **View** permission on the app item.
    HTTP:
      METHOD: GET
      ENDPOINT: /files/{file_id}/app_item_associations
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - file_id:
          TYPE: STRING
          LOCATION: path
      - limit:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
      - marker:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - application_type:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: OBJECT
        RETURNVAR: box_file_appItemAssociations_get
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_file_appItemAssociations_get_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 404
        WHEN: |-
          Returned if the file is not found, or the user does not
          have access to the file. (HTTP 404)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.file.appItemAssociations.get
  box.file.content.get:
    SUMMARY: Download file
    DESC: Returns the contents of a file in binary format.
    HTTP:
      METHOD: GET
      ENDPOINT: /files/{file_id}/content
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/octet-stream
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - file_id:
          TYPE: STRING
          LOCATION: path
      - range:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - boxapi:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - access_token:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: ANY
        RETURNVAR: box_file_content_get
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_file_content_get_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.file.content.get
  box.file.content.create:
    SUMMARY: Upload file version
    DESC: |-
      Update a file's content. For file sizes over 50MB we recommend
      using the Chunk Upload APIs.

      The `attributes` part of the body must come **before** the
      `file` part. Requests that do not follow this format when
      uploading the file will receive a HTTP `400` error with a
      `metadata_after_file_contents` error code.
    HTTP:
      METHOD: POST
      ENDPOINT: /files/{file_id}/content
      HEADERS:
        Content-Type: multipart/form-data
        Authorization: bearer_token
      CONTENT_TYPE: multipart/form-data
      ACCEPT: application/json
      BODYTYPE: form-data
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - file_id:
          TYPE: STRING
          LOCATION: path
      - if-match:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - fields:
          TYPE: "[]STRING"
          REQUIRED: false
          LOCATION: query
      - content-md5:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - attributes:
          TYPE: OBJECT
          LOCATION: body
      - file:
          TYPE: STRING
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(Files)
        RETURNVAR: box_file_content_create
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_file_content_create_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 412
        WHEN: |-
          Returns an error when the `If-Match` header does not match
          the current `etag` value of the file. This indicates that the file
          has changed since it was last requested. (HTTP 412)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.file.content.create
  box.file.content.execute:
    SUMMARY: Preflight check before upload
    DESC: |-
      Performs a check to verify that a file will be accepted by Box
      before you upload the entire file.
    HTTP:
      METHOD: OPTIONS
      ENDPOINT: /files/content
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(api.file.content.executeRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(api.file.content.executeRequest)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(UploadUrl)
        RETURNVAR: box_file_content_execute
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_file_content_execute_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: OBJECT
        STATUS: 409
        WHEN: |-
          If the check did not pass, the response will include some details on
          why it did not pass. (HTTP 409)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.file.content.execute
  box.file.content.create.1:
    SUMMARY: Upload file
    DESC: |-
      Uploads a small file to Box. For file sizes over 50MB we recommend
      using the Chunk Upload APIs.

      The `attributes` part of the body must come **before** the
      `file` part. Requests that do not follow this format when
      uploading the file will receive a HTTP `400` error with a
      `metadata_after_file_contents` error code.
    HTTP:
      METHOD: POST
      ENDPOINT: /files/content
      HEADERS:
        Content-Type: multipart/form-data
        Authorization: bearer_token
      CONTENT_TYPE: multipart/form-data
      ACCEPT: application/json
      BODYTYPE: form-data
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - fields:
          TYPE: "[]STRING"
          REQUIRED: false
          LOCATION: query
      - content-md5:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - attributes:
          TYPE: OBJECT
          LOCATION: body
      - file:
          TYPE: STRING
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(Files)
        RETURNVAR: box_file_content_create_1_201
        STATUS: 201
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_file_content_create_1_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 400
        WHEN: |-
          Returns an error if some of the parameters are missing or
          not valid.
          * `bad_request` when a parameter is missing or incorrect.
          * `item_name_too_long` when the folder name is too long.
          * `item_name_invalid` when the folder name contains
            non-valid characters. (HTTP 400)
      - TYPE: STRUCT(ClientError)
        STATUS: 404
        WHEN: |-
          Returns an error if the parent folder
          does not exist or if the user
          is not authorized to access the parent folder. (HTTP 404)
      - TYPE: STRUCT(ClientError)
        STATUS: 409
        WHEN: |-
          Returns an error if the file already exists,
          or the account has run out of disk space. (HTTP 409)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.file.content.create.1
  box.file.uploadSessions.create:
    SUMMARY: Create upload session
    DESC: Creates an upload session for a new file.
    HTTP:
      METHOD: POST
      ENDPOINT: /files/upload_sessions
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(api.file.uploadSessions.createRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(api.file.uploadSessions.createRequest)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(UploadSession)
        RETURNVAR: box_file_uploadSessions_create_201
        STATUS: 201
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_file_uploadSessions_create_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 400
        WHEN: |-
          Returns an error if some of the parameters are missing or
          not valid.

          * `missing_destination`: No `folder_id` was provided.
          * `invalid_folder_id`: `folder_id` is not valid.
          * `item_name_invalid`: `file_name` is not valid.
          * `missing_file_size`: `file_size` was not provided.
          * `invalid_file_size`: `file_size` was not a valid number.
          * `file_size_too_small`: `file_size` is below minimum file size for
            uploads via this API.
          * `missing_file_name`: `file_name` was not provided. (HTTP 400)
      - TYPE: STRUCT(ClientError)
        STATUS: 403
        WHEN: |-
          Returns an error if the operation is not allowed for some reason.

          * `storage_limit_exceeded`: Account storage limit reached. (HTTP 403)
      - TYPE: STRUCT(ClientError)
        STATUS: 404
        WHEN: |-
          Returns an error if the parent folder could not be found, or
          the authenticated user does not have access to it.

          * `invalid_parameter`: The `folder_id` value represents a
            folder that the user does not have access to, or does not
            exist. (HTTP 404)
      - TYPE: STRUCT(ClientError)
        STATUS: 409
        WHEN: |-
          Returns an error if the file already exists,
          or the account has run out of disk space. (HTTP 409)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.file.uploadSessions.create
  box.file.uploadSessions.create.1:
    SUMMARY: Create upload session for existing file
    DESC: Creates an upload session for an existing file.
    HTTP:
      METHOD: POST
      ENDPOINT: /files/{file_id}/upload_sessions
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(api.file.uploadSessions.createRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - file_id:
          TYPE: STRING
          LOCATION: path
      - body:
          TYPE: STRUCT(api.file.uploadSessions.createRequest)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(UploadSession)
        RETURNVAR: box_file_uploadSessions_create_1_201
        STATUS: 201
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_file_uploadSessions_create_1_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 409
        WHEN: |-
          Returns an error if the file already exists,
          or if the account has run out of disk space. (HTTP 409)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.file.uploadSessions.create.1
  box.file.uploadSessions.get:
    SUMMARY: Get upload session
    DESC: |-
      Return information about an upload session.

      The actual endpoint URL is returned by the [`Create upload session`](https://developer.box.com/reference/post-files-upload-sessions) endpoint.
    HTTP:
      METHOD: GET
      ENDPOINT: /files/upload_sessions/{upload_session_id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - upload_session_id:
          TYPE: STRING
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(UploadSession)
        RETURNVAR: box_file_uploadSessions_get
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_file_uploadSessions_get_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.file.uploadSessions.get
  box.file.uploadSessions.update:
    SUMMARY: Upload part of file
    DESC: |-
      Uploads a chunk of a file for an upload session.

      The actual endpoint URL is returned by the [`Create upload session`](https://developer.box.com/reference/post-files-upload-sessions)
      and [`Get upload session`](https://developer.box.com/reference/get-files-upload-sessions-id) endpoints.
    HTTP:
      METHOD: PUT
      ENDPOINT: /files/upload_sessions/{upload_session_id}
      HEADERS:
        Content-Type: application/octet-stream
        Authorization: bearer_token
      CONTENT_TYPE: application/octet-stream
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - upload_session_id:
          TYPE: STRING
          LOCATION: path
      - digest:
          TYPE: STRING
          LOCATION: header
      - content-range:
          TYPE: STRING
          LOCATION: header
    RETURNS:
      - RETURNTYPE: STRUCT(UploadedPart)
        RETURNVAR: box_file_uploadSessions_update
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_file_uploadSessions_update_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 409
        WHEN: |-
          Returns an error if the chunk conflicts with another
          chunk previously uploaded. (HTTP 409)
      - TYPE: STRUCT(ClientError)
        STATUS: 412
        WHEN: Returns an error if a precondition was not met. (HTTP 412)
      - TYPE: STRUCT(ClientError)
        STATUS: 416
        WHEN: |-
          Returns an error if the content range does not match a specified range
          for the session. (HTTP 416)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.file.uploadSessions.update
  box.file.uploadSessions.delete:
    SUMMARY: Remove upload session
    DESC: |-
      Abort an upload session and discard all data uploaded.

      This cannot be reversed.

      The actual endpoint URL is returned by the [`Create upload session`](https://developer.box.com/reference/post-files-upload-sessions)
      and [`Get upload session`](https://developer.box.com/reference/get-files-upload-sessions-id) endpoints.
    HTTP:
      METHOD: DELETE
      ENDPOINT: /files/upload_sessions/{upload_session_id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - upload_session_id:
          TYPE: STRING
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_file_uploadSessions_delete_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.file.uploadSessions.delete
  box.file.parts.get:
    SUMMARY: List parts
    DESC: |-
      Return a list of the chunks uploaded to the upload session so far.

      The actual endpoint URL is returned by the [`Create upload session`](https://developer.box.com/reference/post-files-upload-sessions)
      and [`Get upload session`](https://developer.box.com/reference/get-files-upload-sessions-id) endpoints.
    HTTP:
      METHOD: GET
      ENDPOINT: /files/upload_sessions/{upload_session_id}/parts
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - upload_session_id:
          TYPE: STRING
          LOCATION: path
      - offset:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          DEFAULT: 0
      - limit:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: OBJECT
        RETURNVAR: box_file_parts_get
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_file_parts_get_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.file.parts.get
  box.file.commit.create:
    SUMMARY: Commit upload session
    DESC: |-
      Close an upload session and create a file from the uploaded chunks.

      The actual endpoint URL is returned by the [`Create upload session`](https://developer.box.com/reference/post-files-upload-sessions)
      and [`Get upload session`](https://developer.box.com/reference/get-files-upload-sessions-id) endpoints.
    HTTP:
      METHOD: POST
      ENDPOINT: /files/upload_sessions/{upload_session_id}/commit
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(api.file.commit.createRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - upload_session_id:
          TYPE: STRING
          LOCATION: path
      - digest:
          TYPE: STRING
          LOCATION: header
      - if-match:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - if-none-match:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - body:
          TYPE: STRUCT(api.file.commit.createRequest)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(Files)
        RETURNVAR: box_file_commit_create_201
        STATUS: 201
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_file_commit_create_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 409
        WHEN: |-
          Returns an error if there is already a file with the same name
          in the target folder. (HTTP 409)
      - TYPE: STRUCT(ClientError)
        STATUS: 412
        WHEN: Returns an error if the `If-Match` or `If-None-Match` conditions fail. (HTTP 412)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.file.commit.create
  box.file.copy.create:
    SUMMARY: Copy file
    DESC: Creates a copy of a file.
    HTTP:
      METHOD: POST
      ENDPOINT: /files/{file_id}/copy
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(api.file.copy.createRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - file_id:
          TYPE: STRING
          LOCATION: path
      - fields:
          TYPE: "[]STRING"
          REQUIRED: false
          LOCATION: query
      - body:
          TYPE: STRUCT(api.file.copy.createRequest)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: OBJECT
        RETURNVAR: box_file_copy_create_201
        STATUS: 201
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_file_copy_create_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 400
        WHEN: |-
          Returns an error if some of the parameters are missing or
          not valid.

          * `bad_request` when a parameter is missing. (HTTP 400)
      - TYPE: STRUCT(ClientError)
        STATUS: 403
        WHEN: |-
          Returns an error when the user does not have the
          right permissions to create the copy a file.

          * `forbidden_by_policy`: Returned if copying a file is
          forbidden due to information barrier restrictions. (HTTP 403)
      - TYPE: STRUCT(ClientError)
        STATUS: 404
        WHEN: |-
          Returns an error if either the source file or the destination
          folder could not be found, or the authenticated user does not
          have access to either.

          * `not_found` when the authenticated user does not have access
            to the source file or the destination folder. (HTTP 404)
      - TYPE: STRUCT(ClientError)
        STATUS: 409
        WHEN: |-
          `operation_blocked_temporary`: Returned if either of the destination
          or source folders is locked due to another move, copy, delete or
          restore operation in process.

          The operation can be retried at a later point.

          `item_name_in_use` when a folder with the same name already
          exists. (HTTP 409)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.file.copy.create
  box.file.thumbnail.extension.get:
    SUMMARY: Get file thumbnail
    DESC: |-
      Retrieves a thumbnail, or smaller image representation, of a file.

      Sizes of `32x32`,`64x64`, `128x128`, and `256x256` can be returned in
      the `.png` format and sizes of `32x32`, `160x160`, and `320x320`
      can be returned in the `.jpg` format.

      Thumbnails can be generated for the image and video file formats listed
      [found on our community site][1].

      [1]: https://community.box.com/t5/Migrating-and-Previewing-Content/File-Types-and-Fonts-Supported-in-Box-Content-Preview/ta-p/327
    HTTP:
      METHOD: GET
      ENDPOINT: /files/{file_id}/thumbnail.{extension}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: image/jpg
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - file_id:
          TYPE: STRING
          LOCATION: path
      - extension:
          TYPE: STRING
          LOCATION: path
      - min_height:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
      - min_width:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
      - max_height:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
      - max_width:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: ANY
        RETURNVAR: box_file_thumbnail_extension_get
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_file_thumbnail_extension_get_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 400
        WHEN: |-
          Returns an error if some of the parameters are missing or
          not valid.

          * `requested_preview_unavailable` - an incorrect dimension was
            requested. This will happen if the dimension requested is
            larger or smaller than the available file sizes for the thumbnail
            format, or when when any of the size constraints contradict
            each other. (HTTP 400)
      - TYPE: STRUCT(ClientError)
        STATUS: 403
        WHEN: |-
          Returned when the access token provided in the `Authorization` header
          is not recognized or not provided. (HTTP 403)
      - TYPE: STRUCT(ClientError)
        STATUS: 404
        WHEN: |-
          Returned if the file is not found, or the user does not
          have access to the file, or for additional reasons.

          * `preview_cannot_be_generated` - Box does not support thumbnails
            for this type of file. (HTTP 404)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.file.thumbnail.extension.get
  box.file.collaborations.get:
    SUMMARY: List file collaborations
    DESC: |-
      Retrieves a list of pending and active collaborations for a
