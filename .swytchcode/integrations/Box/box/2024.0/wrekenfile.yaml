          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(ClassificationTemplate)
        RETURNVAR: box_metadata_template_schemaadd_update
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_metadata_template_schemaadd_update_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 400
        WHEN: Returned if any of the request parameters are not valid. (HTTP 400)
      - TYPE: STRUCT(ClientError)
        STATUS: 404
        WHEN: |-
          Returned when a template name is not correct. Please make sure
          the URL for the request is correct. (HTTP 404)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.metadata_template.schemaadd.update
  box.metadata_template.schemaupdate.update:
    SUMMARY: Update classification
    DESC: |-
      Updates the labels and descriptions of one or more classifications
      available to the enterprise.

      This API can also be called by including the enterprise ID in the
      URL explicitly, for example
      `/metadata_templates/enterprise_12345/securityClassification-6VMVochwUWo/schema`.
    HTTP:
      METHOD: PUT
      ENDPOINT: /metadata_templates/enterprise/securityClassification-6VMVochwUWo/schema#update
      HEADERS:
        Content-Type: application/json-patch+json
        Authorization: bearer_token
      CONTENT_TYPE: application/json-patch+json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    RETURNS:
      - RETURNTYPE: STRUCT(ClassificationTemplate)
        RETURNVAR: box_metadata_template_schemaupdate_update
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_metadata_template_schemaupdate_update_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 400
        WHEN: Returned if any of the request parameters are not valid. (HTTP 400)
      - TYPE: STRUCT(ClientError)
        STATUS: 404
        WHEN: |-
          Returned when a template name is not correct. Please make sure
          the URL for the request is correct. (HTTP 404)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.metadata_template.schemaupdate.update
  box.metadata_template.schema.get:
    SUMMARY: Get metadata template by name
    DESC: |-
      Retrieves a metadata template by its `scope` and `templateKey` values.

      To find the `scope` and `templateKey` for a template, list all templates for
      an enterprise or globally, or list all templates applied to a file or folder.
    HTTP:
      METHOD: GET
      ENDPOINT: /metadata_templates/{scope}/{template_key}/schema
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - scope:
          TYPE: STRING
          LOCATION: path
      - template_key:
          TYPE: STRING
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(MetadataTemplate)
        RETURNVAR: box_metadata_template_schema_get
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_metadata_template_schema_get_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 400
        WHEN: |-
          Returned if any of the request parameters are not valid.

          * `bad_request`: Often returned when the scope of the template is not
            recognised. Please make sure to use either `enterprise` or `global` as
            the `scope` value. (HTTP 400)
      - TYPE: STRUCT(ClientError)
        STATUS: 404
        WHEN: |-
          Returned when a template with the given `scope` and `template_key` can not
          be found. (HTTP 404)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.metadata_template.schema.get
  box.metadata_template.schema.update:
    SUMMARY: Update metadata template
    DESC: |-
      Updates a metadata template.

      The metadata template can only be updated if the template
      already exists.

      The update is applied atomically. If any errors occur during the
      application of the operations, the metadata template will not be changed.
    HTTP:
      METHOD: PUT
      ENDPOINT: /metadata_templates/{scope}/{template_key}/schema
      HEADERS:
        Content-Type: application/json-patch+json
        Authorization: bearer_token
      CONTENT_TYPE: application/json-patch+json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - scope:
          TYPE: STRING
          LOCATION: path
      - template_key:
          TYPE: STRING
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(MetadataTemplate)
        RETURNVAR: box_metadata_template_schema_update
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_metadata_template_schema_update_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 400
        WHEN: The request body does not contain a valid metadata schema. (HTTP 400)
      - TYPE: STRUCT(ClientError)
        STATUS: 403
        WHEN: |-
          The request body contains a scope that the user is not
          allowed to create templates for. (HTTP 403)
      - TYPE: STRUCT(ClientError)
        STATUS: 404
        WHEN: The requested template could not be found. (HTTP 404)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.metadata_template.schema.update
  box.metadata_template.schema.delete:
    SUMMARY: Remove metadata template
    DESC: |-
      Delete a metadata template and its instances.
      This deletion is permanent and can not be reversed.
    HTTP:
      METHOD: DELETE
      ENDPOINT: /metadata_templates/{scope}/{template_key}/schema
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - scope:
          TYPE: STRING
          LOCATION: path
      - template_key:
          TYPE: STRING
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_metadata_template_schema_delete_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 400
        WHEN: Request body does not contain a valid metadata schema. (HTTP 400)
      - TYPE: STRUCT(ClientError)
        STATUS: 403
        WHEN: |-
          Request body contains a scope that the user is not allowed to
          create a template for. (HTTP 403)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.metadata_template.schema.delete
  box.metadata_template.get:
    SUMMARY: Get metadata template by ID
    DESC: Retrieves a metadata template by its ID.
    HTTP:
      METHOD: GET
      ENDPOINT: /metadata_templates/{template_id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - template_id:
          TYPE: STRING
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(MetadataTemplate)
        RETURNVAR: box_metadata_template_get
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_metadata_template_get_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(MetadataTemplate)
        STATUS: 400
        WHEN: |-
          Returned if any of the request parameters are not valid.

          * `bad_request`: Often returned with a message when the ID of the template
            is not recognised. (HTTP 400)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.metadata_template.get
  box.metadata_template.global.list:
    SUMMARY: List all global metadata templates
    DESC: |-
      Used to retrieve all generic, global metadata templates available to all
      enterprises using Box.
    HTTP:
