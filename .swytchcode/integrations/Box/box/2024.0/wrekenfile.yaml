      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_folder_appItemAssociations_get_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 404
        WHEN: |-
          Returned if the folder is not found, or the user does not
          have access to the folder. (HTTP 404)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.folder.appItemAssociations.get
  box.folder.items.get:
    SUMMARY: List items in folder
    DESC: |-
      Retrieves a page of items in a folder. These items can be files,
