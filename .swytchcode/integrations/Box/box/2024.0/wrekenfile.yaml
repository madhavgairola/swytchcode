      METHOD: POST
      ENDPOINT: /ai/ask
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(AiAsk)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(AiAsk)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: OBJECT
        RETURNVAR: box_ai_ask_create
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_ai_ask_create_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected server error. (HTTP 500)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected error. (HTTP default)
    CANONICAL_ID: box.ai.ask.create
