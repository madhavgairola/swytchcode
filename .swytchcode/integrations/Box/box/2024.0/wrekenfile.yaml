  ZipDownload:
    - name: download_url
      type: STRING
      REQUIRED: false
      comment: |-
        The URL that can be used to download the `zip` archive. A `Get` request to
        this URL will start streaming the items requested. By default, this URL
        is only valid for a few seconds, until the `expires_at` time, unless a
        download is started after which it is valid for the duration of the
        download.

        It is important to note that the domain and path of this URL might change
        between API calls, and therefore it's important to use this URL as-is.
    - name: status_url
      type: STRING
      REQUIRED: false
      comment: |-
        The URL that can be used to get the status of the `zip` archive being
        downloaded. A `Get` request to this URL will return the number of files
        in the archive as well as the number of items already downloaded or
        skipped. By default, this URL is only valid for a few seconds, until the
        `expires_at` time, unless a download is started after which the URL is
        valid for 12 hours from the start of the download.

        It is important to note that the domain and path of this URL might change
        between API calls, and therefore it's important to use this URL as-is.
    - name: expires_at
      type: TIMESTAMP
      REQUIRED: false
      comment: |-
        The time and date when this archive will expire. After this time the
        `status_url` and `download_url` will return an error.

        By default, these URLs are only valid for a few seconds, unless a download
        is started after which the `download_url` is valid for the duration of the
        download, and the `status_url` is valid for 12 hours from the start of the
        download.
    - name: name_conflicts
      type: "[]ANY"
      REQUIRED: false
      comment: |-
        A list of conflicts that occurred when trying to create the archive. This
        would occur when multiple items have been requested with the
        same name.

        To solve these conflicts, the API will automatically rename an item
        and return a mapping between the original item's name and its new
        name.

        For every conflict, both files will be renamed and therefore this list
        will always be a multiple of 2.
  ZipDownloadRequest:
    - name: items
      type: "[]ANY"
      REQUIRED: true
      comment: |-
        A list of items to add to the `zip` archive. These can
        be folders or files.
    - name: download_file_name
      type: STRING
      REQUIRED: false
      comment: |-
        The optional name of the `zip` archive. This name will be appended by the
        `.zip` file extension, for example `January Financials.zip`.
  ZipDownloadStatus:
    - name: total_file_count
      type: INT
      REQUIRED: false
      comment: The total number of files in the archive.
    - name: downloaded_file_count
      type: INT
      REQUIRED: false
      comment: The number of files that have already been downloaded.
    - name: skipped_file_count
      type: INT
      REQUIRED: false
      comment: |-
        The number of files that have been skipped as they could not be
        downloaded. In many cases this is due to permission issues that have
        surfaced between the creation of the request for the archive and the
        archive being downloaded.
    - name: skipped_folder_count
      type: INT
      REQUIRED: false
      comment: |-
        The number of folders that have been skipped as they could not be
        downloaded. In many cases this is due to permission issues that have
        surfaced between the creation of the request for the archive and the
        archive being downloaded.
    - name: state
      type: STRING
      REQUIRED: false
      comment: The state of the archive being downloaded.
  api.file.createRequest:
    - name: name
      type: STRING
      REQUIRED: false
      comment: An optional new name for the file.
    - name: parent
      type: ANY
      REQUIRED: false
  api.file.updateRequest:
    - name: name
      type: STRING
      REQUIRED: false
      comment: |-
        An optional different name for the file. This can be used to
        rename the file.

        File names must be unique within their parent folder. The name check is case-insensitive, so a file
        named `New File` cannot be created in a parent folder that already contains a folder named `new file`.
    - name: description
      type: STRING
      REQUIRED: false
      comment: |-
        The description for a file. This can be seen in the right-hand sidebar panel
        when viewing a file in the Box web app. Additionally, this index is used in
        the search index of the file, allowing users to find the file by the content
        in the description.
    - name: parent
      type: ANY
      REQUIRED: false
    - name: shared_link
      type: ANY
      REQUIRED: false
    - name: lock
      type: OBJECT
      REQUIRED: false
      comment: |-
        Defines a lock on an item. This prevents the item from being
        moved, renamed, or otherwise changed by anyone other than the user
        who created the lock.

        Set this to `null` to remove the lock.
    - name: disposition_at
      type: TIMESTAMP
      REQUIRED: false
      comment: |-
        The retention expiration timestamp for the given file. This
        date cannot be shortened once set on a file.
    - name: permissions
      type: OBJECT
      REQUIRED: false
      comment: Defines who can download a file.
    - name: collections
      type: "[]ANY"
      REQUIRED: false
      comment: |-
        An array of collections to make this file
        a member of. Currently
        we only support the `favorites` collection.

        To get the ID for a collection, use the
        [List all collections][1] endpoint.

        Passing an empty array `[]` or `null` will remove
        the file from all collections.

        [1]: https://developer.box.com/reference/get-collections
    - name: tags
      type: "[]STRING"
      REQUIRED: false
      comment: |-
        The tags for this item. These tags are shown in
        the Box web app and mobile apps next to an item.

        To add or remove a tag, retrieve the item's current tags,
        modify them, and then update this field.

        There is a limit of 100 tags per item, and 10,000
        unique tags per enterprise.
  api.file.content.executeRequest:
    - name: name
      type: STRING
      REQUIRED: false
      comment: The name for the file.
    - name: size
      type: INT
      REQUIRED: false
      comment: The size of the file in bytes.
    - name: parent
      type: ANY
      REQUIRED: false
  api.file.uploadSessions.createRequest:
    - name: folder_id
      type: STRING
      REQUIRED: true
      comment: The ID of the folder to upload the new file to.
    - name: file_size
      type: INT
      REQUIRED: true
      comment: The total number of bytes of the file to be uploaded.
    - name: file_name
      type: STRING
      REQUIRED: true
      comment: The name of new file.
  api.file.commit.createRequest:
    - name: parts
      type: "[]STRUCT(UploadPart)"
      REQUIRED: true
      comment: The list details for the uploaded parts.
  api.file.copy.createRequest:
    - name: name
      type: STRING
      REQUIRED: false
      comment: |-
        An optional new name for the copied file.

        There are some restrictions to the file name. Names containing
        non-printable ASCII characters, forward and backward slashes
        (`/`, `\`), and protected names like `.` and `..` are
        automatically sanitized by removing the non-allowed
        characters.
    - name: version
      type: STRING
      REQUIRED: false
      comment: An optional ID of the specific file version to copy.
    - name: parent
      type: OBJECT
      REQUIRED: true
      comment: The destination folder to copy the file to.
  api.file.versions.updateRequest:
    - name: trashed_at
      type: STRING
      REQUIRED: false
      comment: |-
        Set this to `null` to clear
        the date and restore the file.
  api.file.current.createRequest:
    - name: id
      type: STRING
      REQUIRED: false
      comment: The file version ID.
    - name: type
      type: STRING
      REQUIRED: false
      comment: The type to promote.
  api.file.securityClassification6VMVochwUWo.createRequest:
    - name: Box__Security__Classification__Key
      type: STRING
      REQUIRED: false
      comment: |-
        The name of the classification to apply to this file.

        To list the available classifications in an enterprise,
        use the classification API to retrieve the
        [classification template](https://developer.box.com/reference/get-metadata-templates-enterprise-securityClassification-6VMVochwUWo-schema)
        which lists all available classification keys.
  api.file.boxSkillsCards.createRequest:
    - name: cards
      type: "[]STRUCT(SkillCard)"
      REQUIRED: true
      comment: A list of Box Skill cards to apply to this file.
  api.file.watermark.updateRequest:
    - name: watermark
      type: OBJECT
      REQUIRED: true
      comment: The watermark to imprint on the file.
  api.folder.createRequest:
    - name: name
      type: STRING
      REQUIRED: false
      comment: An optional new name for the folder.
    - name: parent
      type: ANY
      REQUIRED: false
  api.folder.updateRequest:
    - name: name
      type: STRING
      REQUIRED: false
      comment: |-
        The optional new name for this folder.

        The following restrictions to folder names apply: names containing
        non-printable ASCII characters, forward and backward slashes
        (`/`, `\`), names with trailing spaces, and names `.` and `..` are
        not allowed.

        Folder names must be unique within their parent folder. The name check is case-insensitive,
        so a folder named `New Folder` cannot be created in a parent folder that already contains
        a folder named `new folder`.
    - name: description
      type: STRING
      REQUIRED: false
      comment: The optional description of this folder.
    - name: sync_state
      type: STRING
      REQUIRED: false
      comment: |-
        Specifies whether a folder should be synced to a
        user's device or not. This is used by Box Sync
        (discontinued) and is not used by Box Drive.
    - name: can_non_owners_invite
      type: BOOL
      REQUIRED: false
      comment: |-
        Specifies if users who are not the owner
        of the folder can invite new collaborators to the folder.
    - name: parent
      type: ANY
      REQUIRED: false
    - name: shared_link
      type: ANY
      REQUIRED: false
    - name: folder_upload_email
      type: ANY
      REQUIRED: false
    - name: tags
      type: "[]STRING"
      REQUIRED: false
      comment: |-
        The tags for this item. These tags are shown in
        the Box web app and mobile apps next to an item.

        To add or remove a tag, retrieve the item's current tags,
        modify them, and then update this field.

        There is a limit of 100 tags per item, and 10,000
        unique tags per enterprise.
    - name: is_collaboration_restricted_to_enterprise
      type: BOOL
      REQUIRED: false
      comment: |-
        Specifies if new invites to this folder are restricted to users
        within the enterprise. This does not affect existing
        collaborations.
    - name: collections
      type: "[]ANY"
      REQUIRED: false
      comment: |-
        An array of collections to make this folder
        a member of. Currently
        we only support the `favorites` collection.

        To get the ID for a collection, use the
        [List all collections][1] endpoint.

        Passing an empty array `[]` or `null` will remove
        the folder from all collections.

        [1]: https://developer.box.com/reference/get-collections
    - name: can_non_owners_view_collaborators
      type: BOOL
      REQUIRED: false
      comment: |-
        Restricts collaborators who are not the owner of
        this folder from viewing other collaborations on
        this folder.

        It also restricts non-owners from inviting new
        collaborators.

        When setting this field to `false`, it is required
        to also set `can_non_owners_invite_collaborators` to
        `false` if it has not already been set.
  api.folder.copy.createRequest:
    - name: name
      type: STRING
      REQUIRED: false
      comment: |-
        An optional new name for the copied folder.

        There are some restrictions to the file name. Names containing
        non-printable ASCII characters, forward and backward slashes
        (`/`, `\`), as well as names with trailing spaces are
        prohibited.

        Additionally, the names `.` and `..` are
        not allowed either.
    - name: parent
      type: OBJECT
      REQUIRED: true
      comment: The destination folder to copy the folder to.
  api.folder.securityClassification6VMVochwUWo.createRequest:
    - name: Box__Security__Classification__Key
      type: STRING
      REQUIRED: false
      comment: |-
        The name of the classification to apply to this folder.

        To list the available classifications in an enterprise,
        use the classification API to retrieve the
        [classification template](https://developer.box.com/reference/get-metadata-templates-enterprise-securityClassification-6VMVochwUWo-schema)
        which lists all available classification keys.
  api.folder.watermark.updateRequest:
    - name: watermark
      type: OBJECT
      REQUIRED: true
      comment: The watermark to imprint on the folder.
  api.folder_lock.createRequest:
    - name: locked_operations
      type: OBJECT
      REQUIRED: false
      comment: |-
        The operations to lock for the folder. If `locked_operations` is
        included in the request, both `move` and `delete` must also be
        included and both set to `true`.
    - name: folder
      type: OBJECT
      REQUIRED: true
      comment: The folder to apply the lock to.
  api.metadata_template.schema.createRequest:
    - name: scope
      type: STRING
      REQUIRED: true
      comment: |-
        The scope of the metadata template to create. Applications can
        only create templates for use within the authenticated user's
        enterprise.

        This value needs to be set to `enterprise`, as `global` scopes can
        not be created by applications.
    - name: templateKey
      type: STRING
      REQUIRED: false
      comment: |-
        A unique identifier for the template. This identifier needs to be
        unique across the enterprise for which the metadata template is
        being created.

        When not provided, the API will create a unique `templateKey`
        based on the value of the `displayName`.
    - name: displayName
      type: STRING
      REQUIRED: true
      comment: The display name of the template.
    - name: hidden
      type: BOOL
      REQUIRED: false
      comment: |-
        Defines if this template is visible in the Box web app UI, or if
        it is purely intended for usage through the API.
    - name: fields
      type: "[]ANY"
      REQUIRED: false
      comment: |-
        An ordered list of template fields which are part of the template.
        Each field can be a regular text field, date field, number field,
        as well as a single or multi-select list.
    - name: copyInstanceOnItemCopy
      type: BOOL
      REQUIRED: false
      comment: |-
        Whether or not to copy any metadata attached to a file or folder
        when it is copied. By default, metadata is not copied along with a
        file or folder when it is copied.
  api.metadata_template.schemaclassifications.createRequest:
    - name: scope
      type: STRING
      REQUIRED: true
      comment: |-
        The scope in which to create the classifications. This should
        be `enterprise` or `enterprise_{id}` where `id` is the unique
        ID of the enterprise.
    - name: templateKey
      type: STRING
      REQUIRED: true
      comment: Defines the list of metadata templates.
    - name: displayName
      type: STRING
      REQUIRED: true
      comment: |-
        The name of the
        template as shown in web and mobile interfaces.
    - name: hidden
      type: BOOL
      REQUIRED: false
      comment: |-
        Determines if the classification template is
        hidden or available on web and mobile
        devices.
    - name: copyInstanceOnItemCopy
      type: BOOL
      REQUIRED: false
      comment: |-
        Determines if classifications are
        copied along when the file or folder is
        copied.
    - name: fields
      type: "[]ANY"
      REQUIRED: true
      comment: |-
        The classification template requires exactly
        one field, which holds
        all the valid classification values.
  api.metadata_cascade_policy.createRequest:
    - name: folder_id
      type: STRING
      REQUIRED: true
      comment: |-
        The ID of the folder to apply the policy to. This folder will
        need to already have an instance of the targeted metadata
        template applied to it.
    - name: scope
      type: STRING
      REQUIRED: true
      comment: |-
        The scope of the targeted metadata template. This template will
        need to already have an instance applied to the targeted folder.
    - name: templateKey
      type: STRING
      REQUIRED: true
      comment: |-
        The key of the targeted metadata template. This template will
        need to already have an instance applied to the targeted folder.

        In many cases the template key is automatically derived
        of its display name, for example `Contract Template` would
        become `contractTemplate`. In some cases the creator of the
        template will have provided its own template key.

        Please [list the templates for an enterprise][list], or
        get all instances on a [file][file] or [folder][folder]
        to inspect a template's key.

        [list]: https://developer.box.com/reference/get-metadata-templates-enterprise
        [file]: https://developer.box.com/reference/get-files-id-metadata
        [folder]: https://developer.box.com/reference/get-folders-id-metadata
  api.metadata_cascade_policy.apply.createRequest:
    - name: conflict_resolution
      type: STRING
      REQUIRED: true
      comment: |-
        Describes the desired behavior when dealing with the conflict
        where a metadata template already has an instance applied
        to a child.

        * `none` will preserve the existing value on the file
        * `overwrite` will force-apply the templates values over
          any existing values.
  api.comment.updateRequest:
    - name: message
      type: STRING
      REQUIRED: false
      comment: The text of the comment to update.
  api.comment.createRequest:
    - name: message
      type: STRING
      REQUIRED: true
      comment: |-
        The text of the comment.

        To mention a user, use the `tagged_message`
        parameter instead.
    - name: tagged_message
      type: STRING
      REQUIRED: false
      comment: |-
        The text of the comment, including `@[user_id:name]`
        somewhere in the message to mention another user, which
        will send them an email notification, letting them know
        they have been mentioned.

        The `user_id` is the target user's ID, where the `name`
        can be any custom phrase. In the Box UI this name will
        link to the user's profile.

        If you are not mentioning another user, use `message`
        instead.
    - name: item
      type: OBJECT
      REQUIRED: true
      comment: The item to attach the comment to.
  api.collaboration.updateRequest:
    - name: role
      type: STRING
      REQUIRED: false
      comment: The level of access granted.
    - name: status
      type: STRING
      REQUIRED: false
      comment: |-
        Set the status of a `pending` collaboration invitation,
        effectively accepting, or rejecting the invite.
    - name: expires_at
      type: TIMESTAMP
      REQUIRED: false
      comment: |-
        Update the expiration date for the collaboration. At this date,
        the collaboration will be automatically removed from the item.

        This feature will only work if the **Automatically remove invited
        collaborators: Allow folder owners to extend the expiry date**
        setting has been enabled in the **Enterprise Settings**
        of the **Admin Console**. When the setting is not enabled,
        collaborations can not have an expiry date and a value for this
        field will be result in an error.

        Additionally, a collaboration can only be given an
        expiration if it was created after the **Automatically remove
        invited collaborator** setting was enabled.
    - name: can_view_path
      type: BOOL
      REQUIRED: false
      comment: |-
        Determines if the invited users can see the entire parent path to
        the associated folder. The user will not gain privileges in any
        parent folder and therefore can not see content the user is not
        collaborated on.

        Be aware that this meaningfully increases the time required to load the
        invitee's **All Files** page. We recommend you limit the number of
        collaborations with `can_view_path` enabled to 1,000 per user.

        Only an owner or co-owners can invite collaborators with a `can_view_path` of
        `true`. Only an owner can update `can_view_path` on existing collaborations.

        `can_view_path` can only be used for folder collaborations.

        When you delete a folder with `can_view_path=true`, collaborators may still see the parent path.
        For instructions on how to remove this, see
        [Even though a folder invited via can_view_path is deleted, the path remains displayed](https://support.box.com/hc/en-us/articles/37472814319891-Even-though-a-folder-invited-via-can-view-path-is-deleted-the-path-remains-displayed).
  api.collaboration.createRequest:
    - name: item
      type: OBJECT
      REQUIRED: true
      comment: The item to attach the comment to.
    - name: accessible_by
      type: OBJECT
      REQUIRED: true
      comment: The user or group to give access to the item.
    - name: role
      type: STRING
      REQUIRED: true
      comment: The level of access granted.
    - name: is_access_only
      type: BOOL
      REQUIRED: false
      comment: |-
        If set to `true`, collaborators have access to
        shared items, but such items won't be visible in the
        All Files list. Additionally, collaborators won't
        see the path to the root folder for the
        shared item.
    - name: can_view_path
      type: BOOL
      REQUIRED: false
      comment: |-
        Determines if the invited users can see the entire parent path to
        the associated folder. The user will not gain privileges in any
        parent folder and therefore can not see content the user is not
        collaborated on.

        Be aware that this meaningfully increases the time required to load the
        invitee's **All Files** page. We recommend you limit the number of
        collaborations with `can_view_path` enabled to 1,000 per user.

        Only an owner or co-owners can invite collaborators with a `can_view_path` of
        `true`. Only an owner can update `can_view_path` on existing collaborations.

        `can_view_path` can only be used for folder collaborations.

        When you delete a folder with `can_view_path=true`, collaborators may still see the parent path.
        For instructions on how to remove this, see
        [Even though a folder invited via can_view_path is deleted, the path remains displayed](https://support.box.com/hc/en-us/articles/37472814319891-Even-though-a-folder-invited-via-can-view-path-is-deleted-the-path-remains-displayed).
    - name: expires_at
      type: TIMESTAMP
      REQUIRED: false
      comment: |-
        Set the expiration date for the collaboration. At this date, the
        collaboration will be automatically removed from the item.

        This feature will only work if the **Automatically remove invited
        collaborators: Allow folder owners to extend the expiry date**
        setting has been enabled in the **Enterprise Settings**
        of the **Admin Console**. When the setting is not enabled,
        collaborations can not have an expiry date and a value for this
        field will be result in an error.
  api.task.createRequest:
    - name: item
      type: OBJECT
      REQUIRED: true
      comment: The file to attach the task to.
    - name: action
      type: STRING
      REQUIRED: false
      comment: |-
        The action the task assignee will be prompted to do. Must be

        * `review` defines an approval task that can be approved or,
        rejected
        * `complete` defines a general task which can be completed.
    - name: message
      type: STRING
      REQUIRED: false
      comment: An optional message to include with the task.
    - name: due_at
      type: TIMESTAMP
      REQUIRED: false
      comment: |-
        Defines when the task is due. Defaults to `null` if not
        provided.
    - name: completion_rule
      type: STRING
      REQUIRED: false
      comment: |-
        Defines which assignees need to complete this task before the task
        is considered completed.

        * `all_assignees` (default) requires all assignees to review or
        approve the task in order for it to be considered completed.
        * `any_assignee` accepts any one assignee to review or
        approve the task in order for it to be considered completed.
  api.task.updateRequest:
    - name: action
      type: STRING
      REQUIRED: false
      comment: |-
        The action the task assignee will be prompted to do. Must be

        * `review` defines an approval task that can be approved or
        rejected,
        * `complete` defines a general task which can be completed.
    - name: message
      type: STRING
      REQUIRED: false
      comment: The message included with the task.
    - name: due_at
      type: TIMESTAMP
      REQUIRED: false
      comment: When the task is due at.
    - name: completion_rule
      type: STRING
      REQUIRED: false
      comment: |-
        Defines which assignees need to complete this task before the task
        is considered completed.

        * `all_assignees` (default) requires all assignees to review or
        approve the task in order for it to be considered completed.
        * `any_assignee` accepts any one assignee to review or
        approve the task in order for it to be considered completed.
  api.task_assignment.createRequest:
    - name: task
      type: OBJECT
      REQUIRED: true
      comment: The task to assign to a user.
    - name: assign_to
      type: OBJECT
      REQUIRED: true
      comment: The user to assign the task to.
  api.task_assignment.updateRequest:
    - name: message
      type: STRING
      REQUIRED: false
      comment: An optional message by the assignee that can be added to the task.
    - name: resolution_state
      type: STRING
      REQUIRED: false
      comment: |-
        The state of the task assigned to the user.

        * For a task with an `action` value of `complete` this can be
        `incomplete` or `completed`.
        * For a task with an `action` of `review` this can be
        `incomplete`, `approved`, or `rejected`.
  api.file.fileIdaddSharedLink.updateRequest:
    - name: shared_link
      type: OBJECT
      REQUIRED: false
      comment: |-
        The settings for the shared link to create on the file.
        Use an empty object (`{}`) to use the default settings for shared
        links.
  api.file.fileIdupdateSharedLink.updateRequest:
    - name: shared_link
      type: OBJECT
      REQUIRED: false
      comment: The settings for the shared link to update.
  api.file.fileIdremoveSharedLink.updateRequest:
    - name: shared_link
      type: OBJECT
      REQUIRED: false
      comment: |-
        By setting this value to `null`, the shared link
        is removed from the file.
  api.folder.folderIdaddSharedLink.updateRequest:
    - name: shared_link
      type: OBJECT
      REQUIRED: false
      comment: |-
        The settings for the shared link to create on the folder.

        Use an empty object (`{}`) to use the default settings for shared
        links.
  api.folder.folderIdupdateSharedLink.updateRequest:
    - name: shared_link
      type: OBJECT
      REQUIRED: false
      comment: The settings for the shared link to update.
  api.folder.folderIdremoveSharedLink.updateRequest:
    - name: shared_link
      type: OBJECT
      REQUIRED: false
      comment: |-
        By setting this value to `null`, the shared link
        is removed from the folder.
  api.web_link.createRequest:
    - name: url
      type: STRING
      REQUIRED: true
      comment: |-
        The URL that this web link links to. Must start with
        `"http://"` or `"https://"`.
    - name: parent
      type: OBJECT
      REQUIRED: true
      comment: The parent folder to create the web link within.
    - name: name
      type: STRING
      REQUIRED: false
      comment: Name of the web link. Defaults to the URL if not set.
    - name: description
      type: STRING
      REQUIRED: false
      comment: Description of the web link.
  api.web_link.updateRequest:
    - name: url
      type: STRING
      REQUIRED: false
      comment: |-
        The new URL that the web link links to. Must start with
        `"http://"` or `"https://"`.
    - name: parent
      type: ANY
      REQUIRED: false
    - name: name
      type: STRING
      REQUIRED: false
      comment: A new name for the web link. Defaults to the URL if not set.
    - name: description
      type: STRING
      REQUIRED: false
      comment: A new description of the web link.
    - name: shared_link
      type: OBJECT
      REQUIRED: false
      comment: The settings for the shared link to update.
  api.web_link.webLinkIdaddSharedLink.updateRequest:
    - name: shared_link
      type: OBJECT
      REQUIRED: false
      comment: |-
        The settings for the shared link to create on the web link.

        Use an empty object (`{}`) to use the default settings for shared
        links.
  api.web_link.webLinkIdupdateSharedLink.updateRequest:
    - name: shared_link
      type: OBJECT
      REQUIRED: false
      comment: The settings for the shared link to update.
  api.web_link.webLinkIdremoveSharedLink.updateRequest:
    - name: shared_link
      type: OBJECT
      REQUIRED: false
      comment: |-
        By setting this value to `null`, the shared link
        is removed from the web link.
  api.user.createRequest:
    - name: name
      type: STRING
      REQUIRED: true
      comment: The name of the user.
    - name: login
      type: STRING
      REQUIRED: false
      comment: |-
        The email address the user uses to log in

        Required, unless `is_platform_access_only`
        is set to `true`.
    - name: is_platform_access_only
      type: BOOL
      REQUIRED: false
      comment: Specifies that the user is an app user.
    - name: role
      type: STRING
      REQUIRED: false
      comment: The user’s enterprise role.
    - name: language
      type: STRING
      REQUIRED: false
      comment: |-
        The language of the user, formatted in modified version of the
        [ISO 639-1](https://developer.box.com/guides/api-calls/language-codes) format.
    - name: is_sync_enabled
      type: BOOL
      REQUIRED: false
      comment: Whether the user can use Box Sync.
    - name: job_title
      type: STRING
      REQUIRED: false
      comment: The user’s job title.
    - name: phone
      type: STRING
      REQUIRED: false
      comment: The user’s phone number.
    - name: address
      type: STRING
      REQUIRED: false
      comment: The user’s address.
    - name: space_amount
      type: INT
      REQUIRED: false
      comment: |-
        The user’s total available space in bytes. Set this to `-1` to
        indicate unlimited storage.
    - name: tracking_codes
      type: "[]STRUCT(TrackingCode)"
      REQUIRED: false
      comment: |-
        Tracking codes allow an admin to generate reports from the
        admin console and assign an attribute to a specific group
        of users. This setting must be enabled for an enterprise before it
        can be used.
    - name: can_see_managed_users
      type: BOOL
      REQUIRED: false
