      - TYPE: STRUCT(ClientError)
        STATUS: 404
        WHEN: Returns `not_found` if integration mapping object was not found. (HTTP 404)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
