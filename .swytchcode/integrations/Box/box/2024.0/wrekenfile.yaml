    INPUTS:
      - file_id:
          TYPE: STRING
          LOCATION: path
      - file_version_id:
          TYPE: STRING
          LOCATION: path
      - if-match:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
    RETURNS:
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_file_versions_delete_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.file.versions.delete
  box.file.versions.update:
    SUMMARY: Restore file version
    DESC: |-
      Restores a specific version of a file after it was deleted.
      Don't use this endpoint to restore Box Notes,
      as it works with file formats such as PDF, DOC,
      PPTX or similar.
    HTTP:
      METHOD: PUT
      ENDPOINT: /files/{file_id}/versions/{file_version_id}
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(api.file.versions.updateRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - file_id:
          TYPE: STRING
          LOCATION: path
      - file_version_id:
          TYPE: STRING
          LOCATION: path
      - body:
          TYPE: STRUCT(api.file.versions.updateRequest)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: OBJECT
        RETURNVAR: box_file_versions_update
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_file_versions_update_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.file.versions.update
  box.file.current.create:
    SUMMARY: Promote file version
    DESC: |-
      Promote a specific version of a file.

      If previous versions exist, this method can be used to
      promote one of the older versions to the top of the version history.

      This creates a new copy of the old version and puts it at the
      top of the versions history. The file will have the exact same contents
      as the older version, with the same hash digest, `etag`, and
      name as the original.

      Other properties such as comments do not get updated to their
      former values.

      Don't use this endpoint to restore Box Notes,
      as it works with file formats such as PDF, DOC,
      PPTX or similar.
    HTTP:
      METHOD: POST
      ENDPOINT: /files/{file_id}/versions/current
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(api.file.current.createRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - file_id:
          TYPE: STRING
          LOCATION: path
      - fields:
          TYPE: "[]STRING"
          REQUIRED: false
          LOCATION: query
      - body:
          TYPE: STRUCT(api.file.current.createRequest)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: OBJECT
        RETURNVAR: box_file_current_create_201
        STATUS: 201
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_file_current_create_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.file.current.create
  box.file.metadata.get:
