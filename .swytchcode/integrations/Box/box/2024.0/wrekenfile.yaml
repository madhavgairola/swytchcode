      type: OBJECT
      REQUIRED: false
      comment: The optional file version to assign the cards to.
    - name: usage
      type: OBJECT
      REQUIRED: false
      comment: |-
        A descriptor that defines what items are affected by this call.

        Set this to the default values when setting a card to a `success`
        state, and leave it out in most other situations.
  api.retention_policy.createRequest:
    - name: policy_name
      type: STRING
      REQUIRED: true
      comment: The name for the retention policy.
    - name: description
      type: STRING
      REQUIRED: false
      comment: The additional text description of the retention policy.
    - name: policy_type
      type: STRING
      REQUIRED: true
      comment: |-
        The type of the retention policy. A retention
        policy type can either be `finite`, where a
        specific amount of time to retain the content is known
        upfront, or `indefinite`, where the amount of time
        to retain the content is still unknown.
    - name: disposition_action
      type: STRING
      REQUIRED: true
      comment: |-
        The disposition action of the retention policy.
        `permanently_delete` deletes the content
        retained by the policy permanently.
        `remove_retention` lifts retention policy
        from the content, allowing it to be deleted
        by users once the retention policy has expired.
    - name: retention_length
      type: ANY
      REQUIRED: false
      comment: |-
        The length of the retention policy. This value
        specifies the duration in days that the retention
        policy will be active for after being assigned to
        content.  If the policy has a `policy_type` of
        `indefinite`, the `retention_length` will also be
        `indefinite`.
    - name: retention_type
      type: STRING
      REQUIRED: false
      comment: |-
        Specifies the retention type:

        * `modifiable`: You can modify the retention policy. For example,
        you can add or remove folders, shorten or lengthen
        the policy duration, or delete the assignment.
        Use this type if your retention policy
        is not related to any regulatory purposes.

        * `non_modifiable`: You can modify the retention policy
        only in a limited way: add a folder, lengthen the duration,
        retire the policy, change the disposition action
        or notification settings. You cannot perform other actions,
        such as deleting the assignment or shortening the
        policy duration. Use this type to ensure
        compliance with regulatory retention policies.
    - name: can_owner_extend_retention
      type: BOOL
      REQUIRED: false
      comment: |-
        Whether the owner of a file will be allowed to
        extend the retention.
    - name: max_extension_length
      type: STRUCT(RetentionPolicyMaxExtensionLengthRequest)
      REQUIRED: false
    - name: are_owners_notified
      type: BOOL
      REQUIRED: false
      comment: |-
        Whether owner and co-owners of a file are notified
        when the policy nears expiration.
    - name: custom_notification_recipients
      type: "[]STRUCT(User--Mini)"
      REQUIRED: false
      comment: |-
        A list of users notified when
        the retention policy duration is about to end.
  api.retention_policy.updateRequest:
    - name: policy_name
      type: STRING
      REQUIRED: false
      comment: The name for the retention policy.
    - name: description
      type: STRING
      REQUIRED: false
      comment: The additional text description of the retention policy.
    - name: disposition_action
      type: ANY
      REQUIRED: false
      comment: |-
        The disposition action of the retention policy.
        This action can be `permanently_delete`, which
        will cause the content retained by the policy
        to be permanently deleted, or `remove_retention`,
        which will lift the retention policy from the content,
        allowing it to be deleted by users,
        once the retention policy has expired.
        You can use `null` if you don't want to change `disposition_action`.
    - name: retention_type
      type: STRING
      REQUIRED: false
      comment: |-
        Specifies the retention type:

        * `modifiable`: You can modify the retention policy. For example,
        you can add or remove folders, shorten or lengthen
        the policy duration, or delete the assignment.
        Use this type if your retention policy
        is not related to any regulatory purposes.
        * `non-modifiable`: You can modify the retention policy
        only in a limited way: add a folder, lengthen the duration,
        retire the policy, change the disposition action
        or notification settings. You cannot perform other actions,
        such as deleting the assignment or shortening the
        policy duration. Use this type to ensure
        compliance with regulatory retention policies.

        When updating a retention policy, you can use
        `non-modifiable` type only. You can convert a
        `modifiable` policy to `non-modifiable`, but
        not the other way around.
    - name: retention_length
      type: ANY
      REQUIRED: false
      comment: |-
        The length of the retention policy. This value
        specifies the duration in days that the retention
        policy will be active for after being assigned to
        content.  If the policy has a `policy_type` of
        `indefinite`, the `retention_length` will also be
        `indefinite`.
    - name: status
      type: STRING
      REQUIRED: false
      comment: |-
        Used to retire a retention policy.

        If not retiring a policy, do not include this parameter
        or set it to `null`.
    - name: can_owner_extend_retention
      type: BOOL
      REQUIRED: false
      comment: |-
        Determines if the owner of items under the policy
        can extend the retention when the original retention
        duration is about to end.
    - name: max_extension_length
      type: STRUCT(RetentionPolicyMaxExtensionLengthRequest)
      REQUIRED: false
    - name: are_owners_notified
      type: BOOL
      REQUIRED: false
      comment: |-
        Determines if owners and co-owners of items
        under the policy are notified when
        the retention duration is about to end.
    - name: custom_notification_recipients
      type: "[]STRUCT(User--Base)"
      REQUIRED: false
      comment: A list of users notified when the retention duration is about to end.
  api.retention_policy_assignment.createRequest:
    - name: policy_id
      type: STRING
      REQUIRED: true
      comment: The ID of the retention policy to assign.
    - name: assign_to
      type: OBJECT
      REQUIRED: true
      comment: The item to assign the policy to.
    - name: filter_fields
      type: "[]ANY"
      REQUIRED: false
      comment: |-
        If the `assign_to` type is `metadata_template`,
        then optionally add the `filter_fields` parameter which will
        require an array of objects with a field entry and a value entry.
        Currently only one object of `field` and `value` is supported.
    - name: start_date_field
      type: STRING
      REQUIRED: false
      comment: |-
        The date the retention policy assignment begins.

        If the `assigned_to` type is `metadata_template`,
        this field can be a date field's metadata attribute key id.
  api.legal_hold_policy.createRequest:
    - name: policy_name
      type: STRING
      REQUIRED: true
      comment: The name of the policy.
    - name: description
      type: STRING
      REQUIRED: false
      comment: A description for the policy.
    - name: filter_started_at
      type: TIMESTAMP
      REQUIRED: false
      comment: |-
        The filter start date.

        When this policy is applied using a `custodian` legal
        hold assignments, it will only apply to file versions
        created or uploaded inside of the
        date range. Other assignment types, such as folders and
        files, will ignore the date filter.

        Required if `is_ongoing` is set to `false`.
    - name: filter_ended_at
      type: TIMESTAMP
      REQUIRED: false
      comment: |-
        The filter end date.

        When this policy is applied using a `custodian` legal
        hold assignments, it will only apply to file versions
        created or uploaded inside of the
        date range. Other assignment types, such as folders and
        files, will ignore the date filter.

        Required if `is_ongoing` is set to `false`.
    - name: is_ongoing
      type: BOOL
      REQUIRED: false
      comment: |-
        Whether new assignments under this policy should
        continue applying to files even after initialization.

        When this policy is applied using a legal hold assignment,
        it will continue applying the policy to any new file versions
        even after it has been applied.

        For example, if a legal hold assignment is placed on a user
        today, and that user uploads a file tomorrow, that file will
        get held. This will continue until the policy is retired.

        Required if no filter dates are set.
  api.legal_hold_policy.updateRequest:
    - name: policy_name
      type: STRING
      REQUIRED: false
      comment: The name of the policy.
    - name: description
      type: STRING
      REQUIRED: false
      comment: A description for the policy.
    - name: release_notes
      type: STRING
      REQUIRED: false
      comment: Notes around why the policy was released.
  api.legal_hold_policy_assignment.createRequest:
