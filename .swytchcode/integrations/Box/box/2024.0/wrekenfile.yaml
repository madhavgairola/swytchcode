STRUCTS:
  AccessToken:
    - name: access_token
      type: STRING
      REQUIRED: false
      comment: The requested access token.
    - name: expires_in
      type: INT
      REQUIRED: false
      comment: The time in seconds by which this token will expire.
    - name: token_type
      type: STRING
      REQUIRED: false
      comment: The type of access token returned.
    - name: restricted_to
      type: "[]STRUCT(ResourceScope)"
      REQUIRED: false
      comment: |-
        The permissions that this access token permits,
        providing a list of resources (files, folders, etc)
        and the scopes permitted for each of those resources.
    - name: refresh_token
      type: STRING
      REQUIRED: false
      comment: |-
        The refresh token for this access token, which can be used
        to request a new access token when the current one expires.
    - name: issued_token_type
      type: STRING
      REQUIRED: false
      comment: |-
        The type of downscoped access token returned. This is only
        returned if an access token has been downscoped.
  ResourceScope:
    - name: scope
      type: STRING
      REQUIRED: false
      comment: The scopes for the resource access.
    - name: object
      type: OBJECT
      REQUIRED: false
  AiAgentAllowedEntity:
    - name: variant_User--Base
      type: STRUCT(User--Base)
      REQUIRED: false
    - name: variant_Group--Base
      type: STRUCT(Group--Base)
      REQUIRED: false
  User--Base:
    - name: id
      type: STRING
      REQUIRED: true
      comment: The unique identifier for this user.
    - name: type
      type: STRING
      REQUIRED: true
      comment: The value will always be `user`.
  Group--Base:
    - name: id
      type: STRING
      REQUIRED: true
      comment: The unique identifier for this object.
    - name: type
      type: STRING
      REQUIRED: true
      comment: The value will always be `group`.
  AiAgentInfo:
    - name: models
      type: "[]ANY"
      REQUIRED: false
      comment: The models used for the request.
    - name: processor
      type: STRING
      REQUIRED: false
      comment: The processor used for the request.
  AiAsk:
    - name: mode
      type: STRING
      REQUIRED: true
      comment: |-
        Box AI handles text documents with text representations up to 2MB in size, or a maximum of 25 files,
        whichever comes first. If the text file size exceeds 2MB, the first 2MB of text representation will be processed.
        Box AI handles image documents with a resolution of 1024 x 1024 pixels, with a maximum of 5 images or 5 pages
        for multi-page images. If the number of image or image pages exceeds 5, the first 5 images or pages will
        be processed. If you set mode parameter to `single_item_qa`, the items array can have one element only.
        Currently Box AI does not support multi-modal requests. If both images and text are sent Box AI will only
        process the text.
    - name: prompt
      type: STRING
      REQUIRED: true
      comment: |-
        The prompt provided by the client to be answered by the LLM.
        The prompt's length is limited to 10000 characters.
    - name: items
      type: "[]STRUCT(AiItemAsk)"
      REQUIRED: true
      comment: |-
        The items to be processed by the LLM, often files.
        To search across and ask questions about the contents of a Box Hub,
        pass a single item with `type` set to `hubs`. See the item `type`
        property for details.
    - name: dialogue_history
      type: "[]STRUCT(AiDialogueHistory)"
      REQUIRED: false
      comment: The history of prompts and answers previously passed to the LLM. This provides additional context to the LLM in generating the response.
    - name: include_citations
      type: BOOL
      REQUIRED: false
      comment: A flag to indicate whether citations should be returned.
    - name: ai_agent
      type: ANY
      REQUIRED: false
  AiItemAsk:
    - name: id
      type: STRING
      REQUIRED: true
      comment: The ID of the file, or the ID of the Box Hub when `type` is `hubs`.
    - name: type
      type: STRING
      REQUIRED: true
      comment: |-
        The type of the item. Use `file` to ask a question about a file, or `hubs` to
        search across and ask a question about the entire contents of a Box Hub.
        A `hubs` item must be the only item in the request.
    - name: content
      type: STRING
      REQUIRED: false
      comment: The content of the item, often the text representation.
  AiDialogueHistory:
    - name: prompt
      type: STRING
      REQUIRED: false
      comment: The prompt previously provided by the client and answered by the LLM.
    - name: answer
      type: STRING
      REQUIRED: false
      comment: The answer previously provided by the LLM.
    - name: created_at
      type: TIMESTAMP
      REQUIRED: false
      comment: The ISO date formatted timestamp of when the previous answer to the prompt was created.
  AiExtract:
    - name: prompt
      type: STRING
      REQUIRED: true
      comment: The prompt provided to a Large Language Model (LLM) in the request. The prompt can be up to 10000 characters long and it can be an XML or a JSON schema.
    - name: items
      type: "[]STRUCT(AiItem--Base)"
      REQUIRED: true
      comment: The items that LLM will process. Currently, you can use files only.
    - name: ai_agent
      type: ANY
      REQUIRED: false
  AiItem--Base:
    - name: id
      type: STRING
      REQUIRED: true
      comment: The ID of the file.
    - name: type
      type: STRING
      REQUIRED: true
      comment: The type of the item. Currently the value can be `file` only.
    - name: content
      type: STRING
      REQUIRED: false
      comment: The content of the item, often the text representation.
  AiExtractStructured:
    - name: items
      type: "[]STRUCT(AiItem--Base)"
      REQUIRED: true
      comment: The items to be processed by the LLM. Currently you can use files only.
    - name: metadata_template
      type: OBJECT
      REQUIRED: false
      comment: |-
        The metadata template containing the fields to extract.
        For your request to work, you must provide either `metadata_template` or `fields`, but not both.
    - name: fields
      type: "[]ANY"
      REQUIRED: false
      comment: |-
        The fields to be extracted from the provided items.
        For your request to work, you must provide either `metadata_template` or `fields`, but not both.
    - name: ai_agent
      type: ANY
      REQUIRED: false
    - name: include_confidence_score
      type: BOOL
      REQUIRED: false
      comment: A flag to indicate whether confidence scores for every extracted field should be returned.
    - name: include_reference
      type: BOOL
      REQUIRED: false
      comment: A flag to indicate whether references for every extracted field should be returned.
    - name: taxonomy_sources
      type: "[]STRUCT(AiTaxonomySource)"
      REQUIRED: false
      comment: |-
        The taxonomy sources to be used for the structured extraction. They can either be an existing file or a taxonomy.
        For your request to work, `fields` must also be provided. `taxonomy_sources` is not supported with `metadata_template`.
  AiTaxonomySource:
    - name: variant_AiTaxonomyReference
      type: STRUCT(AiTaxonomyReference)
      REQUIRED: false
    - name: variant_AiTaxonomyFileReference
      type: STRUCT(AiTaxonomyFileReference)
      REQUIRED: false
  AiTaxonomyReference:
    - name: type
      type: STRING
      REQUIRED: false
      comment: The type of the taxonomy source.
    - name: taxonomy_key
      type: STRING
      REQUIRED: false
      comment: The identifier for a taxonomy, which corresponds to the `taxonomy_key` of the taxonomy source.
    - name: namespace
      type: STRING
      REQUIRED: false
      comment: The namespace of the taxonomy source.
  AiTaxonomyFileReference:
    - name: type
      type: STRING
      REQUIRED: false
      comment: The type of the taxonomy source.
    - name: taxonomy_key
      type: STRING
      REQUIRED: false
      comment: The identifier for a taxonomy, which corresponds to the `taxonomy_key` of the taxonomy source.
    - name: id
      type: STRING
      REQUIRED: false
      comment: The ID of the taxonomy source. Required if the type is `file` and unsupported if the type is `taxonomy`.
  AiExtractStructuredResponse:
    - name: answer
      type: map[STRING]ANY
      REQUIRED: true
    - name: created_at
      type: TIMESTAMP
      REQUIRED: true
      comment: The ISO date formatted timestamp of when the answer to the prompt was created.
    - name: completion_reason
      type: STRING
      REQUIRED: false
      comment: The reason the response finishes.
    - name: confidence_score
      type: map[STRING]ANY
      REQUIRED: false
      comment: The confidence score levels and numeric values for each extracted field as a JSON dictionary. This can be empty if no field could be extracted.
    - name: reference
      type: map[STRING]ANY
      REQUIRED: false
      comment: The reference for each extracted field as a JSON dictionary. This can be empty if no field could be extracted.
    - name: ai_agent_info
      type: STRUCT(AiAgentInfo)
      REQUIRED: false
  AiResponse:
    - name: answer
      type: STRING
      REQUIRED: true
      comment: The answer provided by the LLM.
    - name: created_at
      type: TIMESTAMP
      REQUIRED: true
      comment: The ISO date formatted timestamp of when the answer to the prompt was created.
    - name: completion_reason
      type: STRING
      REQUIRED: false
      comment: The reason the response finishes.
    - name: ai_agent_info
      type: STRUCT(AiAgentInfo)
      REQUIRED: false
  AiStudioAgentAsk:
    - name: type
      type: STRING
      REQUIRED: true
      comment: The type of AI agent used to handle queries.
    - name: access_state
      type: STRING
      REQUIRED: true
      comment: "The state of the AI Agent capability. Possible values are: `enabled` and `disabled`."
    - name: description
      type: STRING
      REQUIRED: true
      comment: The description of the AI agent.
    - name: custom_instructions
      type: STRING
      REQUIRED: false
      comment: Custom instructions for the AI agent.
    - name: suggested_questions
      type: "[]STRING"
      REQUIRED: false
      comment: Suggested questions for the AI agent. If null, suggested question will be generated. If empty, no suggested questions will be displayed.
    - name: long_text
      type: OBJECT
      REQUIRED: false
    - name: basic_text
      type: OBJECT
      REQUIRED: false
    - name: basic_image
      type: OBJECT
      REQUIRED: false
    - name: spreadsheet
      type: OBJECT
      REQUIRED: false
    - name: long_text_multi
      type: OBJECT
      REQUIRED: false
    - name: basic_text_multi
      type: OBJECT
      REQUIRED: false
    - name: basic_image_multi
      type: OBJECT
      REQUIRED: false
  AiStudioAgentExtract:
    - name: type
      type: STRING
      REQUIRED: true
      comment: The type of AI agent to be used for metadata extraction.
    - name: access_state
      type: STRING
      REQUIRED: true
      comment: "The state of the AI Agent capability. Possible values are: `enabled` and `disabled`."
    - name: description
      type: STRING
      REQUIRED: true
      comment: The description of the AI agent.
    - name: custom_instructions
      type: STRING
      REQUIRED: false
      comment: Custom instructions for the AI agent.
    - name: long_text
      type: OBJECT
      REQUIRED: false
    - name: basic_text
      type: OBJECT
      REQUIRED: false
    - name: basic_image
      type: OBJECT
      REQUIRED: false
  AiStudioAgentTextGen:
    - name: type
      type: STRING
      REQUIRED: true
      comment: The type of AI agent used for generating text.
    - name: access_state
      type: STRING
      REQUIRED: true
      comment: "The state of the AI Agent capability. Possible values are: `enabled` and `disabled`."
    - name: description
      type: STRING
      REQUIRED: true
      comment: The description of the AI agent.
    - name: custom_instructions
      type: STRING
      REQUIRED: false
      comment: Custom instructions for the AI agent.
    - name: suggested_questions
      type: "[]STRING"
      REQUIRED: false
      comment: Suggested questions for the AI agent. If null, suggested question will be generated. If empty, no suggested questions will be displayed.
    - name: basic_gen
      type: OBJECT
      REQUIRED: false
  AiTextGen:
    - name: prompt
      type: STRING
      REQUIRED: true
      comment: The prompt provided by the client to be answered by the LLM. The prompt's length is limited to 10000 characters.
    - name: items
      type: "[]ANY"
      REQUIRED: true
      comment: |-
        The items to be processed by the LLM, often files.
        The array can include **exactly one** element.

        **Note**: Box AI handles documents with text representations up to 2MB in size.
        If the file size exceeds 2MB, the first 2MB of text representation will be processed.
    - name: dialogue_history
      type: "[]STRUCT(AiDialogueHistory)"
      REQUIRED: false
