        STATUS: 404
        WHEN: |-
          Returns an error if the folder did not have
          a watermark applied to it. (HTTP 404)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.folder.watermark.delete
  box.folder_lock.list:
    SUMMARY: List folder locks
    DESC: |-
      Retrieves folder lock details for a given folder.

      You must be authenticated as the owner or co-owner of the folder to
      use this endpoint.
    HTTP:
      METHOD: GET
      ENDPOINT: /folder_locks
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - folder_id:
          TYPE: STRING
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(FolderLocks)
        RETURNVAR: box_folder_lock_list
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_folder_lock_list_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 403
        WHEN: |-
          Returned when the access token provided in the `Authorization` header
          is not recognized or not provided. (HTTP 403)
      - TYPE: STRUCT(ClientError)
        STATUS: 404
        WHEN: |-
          Returned if the folder is not found, or the user does not
          have access to the folder. (HTTP 404)
      - TYPE: STRUCT(ClientError)
        STATUS: 405
        WHEN: Returned if the `folder_id` is not in a recognized format. (HTTP 405)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.folder_lock.list
  box.folder_lock.create:
    SUMMARY: Create folder lock
    DESC: |-
      Creates a folder lock on a folder, preventing it from being moved and/or
      deleted.

      You must be authenticated as the owner or co-owner of the folder to
      use this endpoint.
    HTTP:
      METHOD: POST
      ENDPOINT: /folder_locks
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(api.folder_lock.createRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(api.folder_lock.createRequest)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(FolderLock)
        RETURNVAR: box_folder_lock_create
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_folder_lock_create_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 400
        WHEN: |-
          Returns an error when the request body is not valid.

          * `schema_validation_failed` - The request body contains a value for
          a field that either does not exist, or for which the value or type does
          not match the expected field type. An example might be an unknown option
          for an `enum` or `multiSelect` field. (HTTP 400)
      - TYPE: STRUCT(ClientError)
        STATUS: 404
        WHEN: |-
          Returns an error when the folder was not found.

          * `not_found` - The folder could not be found, the user does not have
          access to the folder, or the user making call is not an owner or co-owner
          of folder. (HTTP 404)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.folder_lock.create
  box.folder_lock.delete:
    SUMMARY: Delete folder lock
    DESC: |-
      Deletes a folder lock on a given folder.

      You must be authenticated as the owner or co-owner of the folder to
      use this endpoint.
    HTTP:
      METHOD: DELETE
      ENDPOINT: /folder_locks/{folder_lock_id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - folder_lock_id:
          TYPE: STRING
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_folder_lock_delete_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 403
        WHEN: |-
          Returns an error if the user does not have the required
          access to perform the action.

          * `access_denied_insufficient_permissions`: Returned when the
            user does not have access to the folder.

          * `insufficient_scope`: Returned an error if the application
            does not have the right scope to delete folders. Make sure
            your application has been configured to read and write all files
            and folders stored in Box. (HTTP 403)
      - TYPE: STRUCT(ClientError)
        STATUS: 404
        WHEN: |-
          Returns an error if the folder could not be found,
          or the authenticated user does not have access to the folder.

          * `not_found` when the authenticated user does not have access
            to the folder. (HTTP 404)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.folder_lock.delete
  box.metadata_template.list:
