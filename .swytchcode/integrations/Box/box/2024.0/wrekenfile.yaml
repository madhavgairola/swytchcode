      type: STRING
      REQUIRED: true
      comment: Defines the status of this invocation. Set this to `success` when setting Skill cards.
    - name: metadata
      type: OBJECT
      REQUIRED: true
      comment: |-
        The metadata to set for this skill. This is a list of
        Box Skills cards. These cards will overwrite any existing Box
        skill cards on the file.
    - name: file
      type: OBJECT
      REQUIRED: true
      comment: The file to assign the cards to.
