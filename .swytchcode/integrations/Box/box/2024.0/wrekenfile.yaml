    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 403
        WHEN: |-
          `forbidden`: Returned if the user does not have necessary permissions
           or is not activated. (HTTP 403)
      - TYPE: STRUCT(ClientError)
        STATUS: 404
        WHEN: |-
