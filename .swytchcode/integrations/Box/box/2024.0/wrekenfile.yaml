  box.folder.get:
    SUMMARY: Get folder information
    DESC: |-
      Retrieves details for a folder, including the first 100 entries
      in the folder.

      Passing `sort`, `direction`, `offset`, and `limit`
      parameters in query allows you to manage the
      list of returned
      [folder items](https://developer.box.com/reference/resources/folder--full#param-item-collection).

      To fetch more items within the folder, use the
      [Get items in a folder](https://developer.box.com/reference/get-folders-id-items) endpoint.
    HTTP:
      METHOD: GET
      ENDPOINT: /folders/{folder_id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - folder_id:
          TYPE: STRING
          LOCATION: path
      - fields:
          TYPE: "[]STRING"
          REQUIRED: false
          LOCATION: query
      - if-none-match:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - boxapi:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - sort:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - direction:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - offset:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          DEFAULT: 0
      - limit:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: OBJECT
        RETURNVAR: box_folder_get
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_folder_get_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 403
        WHEN: |-
          Returned when the access token provided in the `Authorization` header
          is not recognized or not provided. (HTTP 403)
      - TYPE: STRUCT(ClientError)
        STATUS: 404
        WHEN: |-
          Returned if the folder is not found, or the user does not
          have access to the folder. (HTTP 404)
      - TYPE: STRUCT(ClientError)
        STATUS: 405
        WHEN: Returned if the `folder_id` is not in a recognized format. (HTTP 405)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.folder.get
  box.folder.create:
    SUMMARY: Restore folder
    DESC: |-
      Restores a folder that has been moved to the trash.

      An optional new parent ID can be provided to restore the folder to in case the
      original folder has been deleted.

      During this operation, part of the file tree will be locked, mainly
      the source folder and all of its descendants, as well as the destination
      folder.

      For the duration of the operation, no other move, copy, delete, or restore
      operation can performed on any of the locked folders.
    HTTP:
      METHOD: POST
      ENDPOINT: /folders/{folder_id}
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(api.folder.createRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - folder_id:
          TYPE: STRING
          LOCATION: path
      - fields:
          TYPE: "[]STRING"
          REQUIRED: false
          LOCATION: query
      - body:
          TYPE: STRUCT(api.folder.createRequest)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(TrashFolderRestored)
        RETURNVAR: box_folder_create_201
        STATUS: 201
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_folder_create_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 403
        WHEN: |-
          Returns an error if the user does not have access to the folder
          the folder is being restored to, or the user does not have permission
          to restore folders from the trash. (HTTP 403)
      - TYPE: STRUCT(ClientError)
        STATUS: 404
        WHEN: Returns an error if the folder is not in the trash. (HTTP 404)
      - TYPE: STRUCT(ClientError)
        STATUS: 409
        WHEN: |-
          Returned an error if there is a folder with the same name
          in the destination folder.

          `operation_blocked_temporary`: Returned if either of the destination
          or source folders is locked due to another move, copy, delete or
          restore operation in process.

          The operation can be retried at a later point. (HTTP 409)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.folder.create
  box.folder.update:
    SUMMARY: Update folder
    DESC: |-
      Updates a folder. This can be also be used to move the folder,
      create shared links, update collaborations, and more.
    HTTP:
      METHOD: PUT
      ENDPOINT: /folders/{folder_id}
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(api.folder.updateRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - folder_id:
          TYPE: STRING
          LOCATION: path
      - fields:
          TYPE: "[]STRING"
          REQUIRED: false
          LOCATION: query
      - if-match:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - body:
          TYPE: STRUCT(api.folder.updateRequest)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: OBJECT
        RETURNVAR: box_folder_update
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_folder_update_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 400
        WHEN: |-
          Returns an error if some of the parameters are missing or
          not valid, or if a folder lock is preventing a move operation.

          * `bad_request` when a parameter is missing or incorrect. This error also
            happens when a password is set for a shared link with an access type
            of `open`.
          * `item_name_too_long` when the folder name is too long.
          * `item_name_invalid` when the folder name contains
            non-valid characters. (HTTP 400)
      - TYPE: STRUCT(ClientError)
        STATUS: 403
        WHEN: |-
          Returns an error if the user does not have the required
          access to perform the action.

          * `access_denied_insufficient_permissions`: Returned when the
            user does not have access to the folder or parent folder, or if the
            folder is being moved and a folder lock has been applied to prevent
            such operations.

          * `insufficient_scope`: Returned an error if the application
            does not have the right scope to update folders. Make sure
            your application has been configured to read and write all files
            and folders stored in Box.

          * `forbidden`: Returned when the user is not allowed to perform this
            action for other users. This can include trying to create a
            Shared Link with a `company` access level on a free account.

          * `forbidden_by_policy`: Returned if copying a folder is
             forbidden due to information barrier restrictions.

          Returns an error if there are too many actions in the request body.

          * `operation_limit_exceeded`: Returned when the user passes any
          parameters in addition to the `parent.id` in the request body.
          The calls to this endpoint have to be split up.
          The first call needs to include only the `parent.id`,
          the next call can include other parameters. (HTTP 403)
      - TYPE: STRUCT(ClientError)
        STATUS: 404
        WHEN: |-
          Returns an error if the folder or parent folder could not be found,
          or the authenticated user does not have access to either folder.

          * `not_found` when the authenticated user does not have access
            to the folder or parent folder. (HTTP 404)
      - TYPE: STRUCT(ClientError)
        STATUS: 409
        WHEN: |-
          `operation_blocked_temporary`: Returned if either of the destination
          or source folders is locked due to another move, copy, delete or
          restore operation in progress.

          The operation can be retried at a later point.

          `item_name_in_use`: Returned if a folder with the name
          already exists in the parent folder. (HTTP 409)
      - TYPE: STRUCT(ClientError)
        STATUS: 412
        WHEN: |-
          Returns an error when the `If-Match` header does not match
          the current `etag` value of the folder. This indicates that the
          folder has changed since it was last requested. (HTTP 412)
      - TYPE: STRUCT(ClientError)
        STATUS: 503
        WHEN: |-
          Returns an error when the operation takes longer
          than 600 seconds. The operation will continue after
          this response has been returned. (HTTP 503)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.folder.update
  box.folder.delete:
    SUMMARY: Delete folder
    DESC: |-
      Deletes a folder, either permanently or by moving it to
      the trash.
    HTTP:
      METHOD: DELETE
      ENDPOINT: /folders/{folder_id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - folder_id:
          TYPE: STRING
          LOCATION: path
      - if-match:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - recursive:
          TYPE: BOOL
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_folder_delete_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 400
        WHEN: |-
          Returns an error if the user makes a bad request.

          * `folder_not_empty`: Returned if the folder is not empty. Use the
            `recursive` query parameter to recursively delete the folder and
            its contents. (HTTP 400)
      - TYPE: STRUCT(ClientError)
        STATUS: 403
        WHEN: |-
          Returns an error if the user does not have the required
          access to perform the action.

          * `access_denied_insufficient_permissions`: Returned when the
            user does not have access to the folder, or when a folder lock has been
            applied to the folder to prevent deletion.

          * `insufficient_scope`: Returned an error if the application
            does not have the right scope to delete folders. Make sure
            your application has been configured to read and write all files
            and folders stored in Box. (HTTP 403)
      - TYPE: STRUCT(ClientError)
        STATUS: 404
        WHEN: |-
          Returns an error if the folder could not be found,
          or the authenticated user does not have access to the folder.

          * `not_found` when the authenticated user does not have access
            to the folder. (HTTP 404)
      - TYPE: STRUCT(ClientError)
        STATUS: 409
        WHEN: |-
          `operation_blocked_temporary`: Returned if the folder
          is locked due to another move, copy, delete or restore
          operation in progress.

          The operation can be retried at a later point. (HTTP 409)
      - TYPE: STRUCT(ClientError)
        STATUS: 412
        WHEN: |-
          Returns an error when the `If-Match` header does not match
          the current `etag` value of the folder. This indicates that the
          folder has changed since it was last requested. (HTTP 412)
      - TYPE: STRUCT(ClientError)
        STATUS: 503
        WHEN: |-
          Returns an error when the operation takes longer
          than 600 seconds. The operation will continue after
          this response has been returned. (HTTP 503)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.folder.delete
  box.folder.appItemAssociations.get:
