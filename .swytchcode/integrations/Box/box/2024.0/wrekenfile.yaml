          REQUIRED: false
          LOCATION: query
      - marker:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: OBJECT
        RETURNVAR: box_file_collaborations_get
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_file_collaborations_get_NaN
