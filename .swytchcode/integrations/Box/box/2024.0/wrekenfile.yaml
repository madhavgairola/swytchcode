    RETURNS:
      - RETURNTYPE: OBJECT
        RETURNVAR: box_metadata_cascade_policy_list
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_metadata_cascade_policy_list_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 400
        WHEN: Returns an error when any of the parameters are not in a valid format. (HTTP 400)
      - TYPE: STRUCT(ClientError)
        STATUS: 403
        WHEN: |-
          Returns an error when the folder can not be accessed. This error often
          happens when accessing the root folder with ID `0`. (HTTP 403)
      - TYPE: STRUCT(ClientError)
        STATUS: 404
        WHEN: |-
          Returns an error when the folder can not be found or the user does not
          have access to the folder.

          * `not_found` - The folder could not be found or the user does not have
            access to the folder. (HTTP 404)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.metadata_cascade_policy.list
  box.metadata_cascade_policy.create:
    SUMMARY: Create metadata cascade policy
    DESC: |-
      Creates a new metadata cascade policy that applies a given
      metadata template to a given folder and automatically
      cascades it down to any files within that folder.

      In order for the policy to be applied a metadata instance must first
      be applied to the folder the policy is to be applied to.
    HTTP:
      METHOD: POST
      ENDPOINT: /metadata_cascade_policies
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(api.metadata_cascade_policy.createRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(api.metadata_cascade_policy.createRequest)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(MetadataCascadePolicy)
        RETURNVAR: box_metadata_cascade_policy_create_201
        STATUS: 201
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_metadata_cascade_policy_create_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 400
        WHEN: |-
          Returns an error when any of the parameters are not in a valid format.

          * `bad_request` - Either the `scope`, `templateKey`, or `folder_id` are
          not in a valid format. (HTTP 400)
      - TYPE: STRUCT(ClientError)
        STATUS: 403
        WHEN: |-
          Returns an error when trying to apply a policy to a restricted folder, for
          example the root folder with ID `0`.

          * `forbidden` - Although the folder ID was valid and the user has access
          to the folder, the policy could not be applied to this folder. (HTTP 403)
      - TYPE: STRUCT(ClientError)
        STATUS: 404
        WHEN: |-
          Returns an error when the template or folder can not be found, or when the
          user does not have access to the folder or template.

          * `instance_tuple_not_found` - The template could not be found or the user
          does not have access to the template.
          * `not_found` - The folder could not be found or the user
          does not have access to the folder. (HTTP 404)
      - TYPE: OBJECT
        STATUS: 409
        WHEN: |-
          Returns an error when a policy for this folder and template is already in
          place.

          * `tuple_already_exists` - A cascade policy for this combination of
          `folder_id`, `scope` and `templateKey` already exists. (HTTP 409)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.metadata_cascade_policy.create
  box.metadata_cascade_policy.get:
    SUMMARY: Get metadata cascade policy
    DESC: Retrieve a specific metadata cascade policy assigned to a folder.
    HTTP:
      METHOD: GET
      ENDPOINT: /metadata_cascade_policies/{metadata_cascade_policy_id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - metadata_cascade_policy_id:
          TYPE: STRING
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(MetadataCascadePolicy)
        RETURNVAR: box_metadata_cascade_policy_get
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_metadata_cascade_policy_get_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 404
        WHEN: |-
          Returns an error when the policy can not be found or the user does not
          have access to the folder.

          * `instance_not_found` - The policy could not be found
          * `not_found` - The folder could not be found or the user does not have
            access to the folder. (HTTP 404)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.metadata_cascade_policy.get
  box.metadata_cascade_policy.delete:
    SUMMARY: Remove metadata cascade policy
    DESC: Deletes a metadata cascade policy.
    HTTP:
      METHOD: DELETE
      ENDPOINT: /metadata_cascade_policies/{metadata_cascade_policy_id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - metadata_cascade_policy_id:
          TYPE: STRING
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_metadata_cascade_policy_delete_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 404
        WHEN: |-
          Returns an error when the policy can not be found or the user does not
          have access to the folder.

          * `instance_not_found` - The policy could not be found
          * `not_found` - The folder could not be found or the user does not have
            access to the folder. (HTTP 404)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.metadata_cascade_policy.delete
  box.metadata_cascade_policy.apply.create:
    SUMMARY: Force-apply metadata cascade policy to folder
    DESC: |-
      Force the metadata on a folder with a metadata cascade policy to be applied to
      all of its children. This can be used after creating a new cascade policy to
      enforce the metadata to be cascaded down to all existing files within that
      folder.
    HTTP:
      METHOD: POST
      ENDPOINT: /metadata_cascade_policies/{metadata_cascade_policy_id}/apply
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(api.metadata_cascade_policy.apply.createRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - metadata_cascade_policy_id:
          TYPE: STRING
          LOCATION: path
      - body:
          TYPE: STRUCT(api.metadata_cascade_policy.apply.createRequest)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_metadata_cascade_policy_apply_create_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 404
        WHEN: |-
          Returns an error when the policy can not be found or the user does not
          have access to the folder.

          * `instance_not_found` - The policy could not be found
          * `not_found` - The folder could not be found or the user does not have
            access to the folder. (HTTP 404)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.metadata_cascade_policy.apply.create
  box.metadata_query.executeRead.create:
    SUMMARY: Query files/folders by metadata
    DESC: |-
      Create a search using SQL-like syntax to return items that match specific
      metadata.

      By default, this endpoint returns only the most basic info about the items for
      which the query matches. To get additional fields for each item, including any
      of the metadata, use the `fields` attribute in the query.
    HTTP:
      METHOD: POST
      ENDPOINT: /metadata_queries/execute_read
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(MetadataQuery)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(MetadataQuery)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(MetadataQueryResults)
        RETURNVAR: box_metadata_query_executeRead_create
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_metadata_query_executeRead_create_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 400
        WHEN: |-
          Returns an error when the request body is not valid.

          * `invalid_query` - Any of the provided body parameters might be
          incorrect. This can mean the `query` is incorrect, as well as some cases
          where the `from` value does not represent a valid template.
          * `unexpected_json_type` - An argument from the `query` string is not
          present in `query_param`. For example, `query` of `name = :name` requires
          the `query_param` to include a value for the `name` argument, for example
          `{ "name": "Box, Inc" }`. (HTTP 400)
      - TYPE: STRUCT(ClientError)
        STATUS: 404
        WHEN: |-
          Returns an error when a metadata template with the given `scope` and
          `templateKey` can not be found. The error response will include extra
          details.

          * `instance_not_found` - The template was not found. Please make sure
          to use the full template scope including the enterprise ID, like
          `enterprise_12345`. (HTTP 404)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.metadata_query.executeRead.create
  box.comment.get:
