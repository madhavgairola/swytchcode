        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(api.metadata_template.schemaclassifications.createRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(api.metadata_template.schemaclassifications.createRequest)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(ClassificationTemplate)
        RETURNVAR: box_metadata_template_schemaclassifications_create
        STATUS: 200
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_metadata_template_schemaclassifications_create_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 400
        WHEN: Returned if any of the request parameters are not valid. (HTTP 400)
      - TYPE: STRUCT(ClientError)
        STATUS: 404
        WHEN: |-
          Returned when a template name is not correct. Please make sure
          the URL for the request is correct. (HTTP 404)
      - TYPE: STRUCT(ClientError)
        STATUS: 500
        WHEN: An unexpected client error. (HTTP default)
    CANONICAL_ID: box.metadata_template.schemaclassifications.create
  box.metadata_cascade_policy.list:
