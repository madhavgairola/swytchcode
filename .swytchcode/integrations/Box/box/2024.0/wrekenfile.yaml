        STATUS: 201
      - RETURNTYPE: STRUCT(ClientError)
        RETURNVAR: box_folder_copy_create_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(ClientError)
        STATUS: 400
        WHEN: |-
