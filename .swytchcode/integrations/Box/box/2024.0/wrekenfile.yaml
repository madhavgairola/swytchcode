    CANONICAL_ID: box.metadata_taxonomy.nodes.update
  box.metadata_taxonomy.nodes.delete:
    SUMMARY: Remove metadata taxonomy node
    DESC: |-
      Delete a metadata taxonomy node.
      This deletion is permanent and cannot be reverted.
      Only metadata taxonomy nodes without any children can be deleted.
    HTTP:
      METHOD: DELETE
      ENDPOINT: /metadata_taxonomies/{namespace}/{taxonomy_key}/nodes/{node_id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
