    HTTP:
      METHOD: GET
      ENDPOINT: /current.json
      HEADERS: {}
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - ApiKeyAuth:
          type: apiKey
          in: query
          name: key
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - key:
          TYPE: STRING
          REQUIRED: true
          LOCATION: query
      - q:
          TYPE: STRING
          REQUIRED: true
          LOCATION: query
      - lang:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - aqi:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
          ENUM:
            - "yes"
            - "no"
      - pollen:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
          ENUM:
            - "yes"
            - "no"
      - current_fields:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: map[STRING]ANY
        RETURNVAR: weatherapi_current_list
        STATUS: 200
    ERRORS:
      - TYPE: ANY
        STATUS: 400
        WHEN: Bad request (HTTP 400)
      - TYPE: ANY
        STATUS: 401
        WHEN: Invalid API key (HTTP 401)
      - TYPE: ANY
        STATUS: 403
        WHEN: Plan does not permit this endpoint/feature (HTTP 403)
      - TYPE: ANY
        STATUS: 429
        WHEN: Rate limit exceeded (HTTP 429)
